

<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#101411">

<title>TP Training Planner</title>

<style>


/* TP - ESTILO ANATOMIA */

.tp-anatomy{
 margin-top:16px;
 padding:16px 10px;
 background:linear-gradient(145deg,#151c19,#101512);
 border:1px solid #303b35;
 border-radius:16px;
 overflow:hidden;
}

.tp-anatomy-heading{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 padding:0 8px;
}

.tp-anatomy-subtitle{
 color:#87938b;
 font-size:9px;
 letter-spacing:1px;
 font-weight:700;
}

.tp-anatomy-figures{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:2px;
 align-items:end;
 margin-top:12px;
}

.tp-anatomy-figure{
 display:flex;
 flex-direction:column;
 align-items:center;
 min-width:0;
}

.tp-anatomy-figure svg{

 height:auto;
}

.tp-anatomy-figure span{

 font-weight:800;
 letter-spacing:1.2px;

}

.tp-anatomy-legend{

 flex-wrap:wrap;
 gap:22px;

 font-size:12px;
}

.tp-anatomy-legend span{
 display:flex;
 align-items:center;

}

.tp-dot{
 display:inline-block;

 height:10px;

.tp-dot.primary{background:#e94d50}
.tp-dot.secondary{background:#c17d59}


/* TP EXERCISE LIBRARY - DARK PERFORMANCE */

:root {
 --bg:#090a0c;
 --panel:#141619;
 --panel2:#1c2024;
 --line:#30353b;
 --green:#d0d4d8;
 --green2:#aeb4bb;
 --text:#f3f4f5;
 --muted:#9299a2;
}

body {
 background:var(--bg);
}

.card {
 background:linear-gradient(145deg,#191c20,#111316);
 border:1px solid #30353b;
 border-radius:16px;
}

.exercise {
 background:linear-gradient(145deg,#202429,#15181c);
 border:1px solid #343a41;
 border-radius:13px;
 transition:border-color .2s,transform .2s;
}

.exercise:hover {
 border-color:#777f89;
}

.btn {
 background:#d5d9de;
 color:#101215;
}

.btn.secondary {
 background:#24292f;
 color:#f3f4f5;
 border:1px solid #414850;
}

.tag {
 background:#30363d;
 color:#e0e4e8;
}

.pill {
 background:#30363d;
 color:#c4cbd2;
}

input:focus,select:focus,textarea:focus {
 border-color:#aab1b9;
}

.library-header {
 padding:20px;
 background:linear-gradient(135deg,#20252b,#101215);
 border:1px solid #353b43;
 border-radius:17px;
 margin-bottom:15px;
}

.library-header h1 {
 font-size:25px;
 letter-spacing:1px;
}

.library-search input {
 padding:15px;
 border-radius:12px;
 background:#101215;
}

.library-categories {
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:9px;
 margin:15px 0;
}

.library-category {
 background:linear-gradient(145deg,#252a30,#14171a);
 border:1px solid #373e46;
 padding:15px 10px;
 border-radius:12px;
 color:#e9ecef;
 text-align:left;
 font-weight:bold;
}

.library-category small {
 display:block;
 color:#9299a2;
 margin-top:5px;
 font-weight:normal;
}

.library-card {
 position:relative;
 padding:14px;
 margin:10px 0;
 background:linear-gradient(145deg,#20252a,#131619);
 border:1px solid #343b42;
 border-radius:14px;
}

.library-card.selected {
 border:1px solid #d0d5dc;
 background:#272d33;
}

.library-card-top {
 display:flex;
 justify-content:space-between;
 gap:12px;
 align-items:flex-start;
}

.library-check {
 width:22px;
 height:22px;
 accent-color:#d4d9df;
 flex-shrink:0;
}

.library-meta {
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:10px;
}

.library-count {
 font-size:12px;
 color:#c3c9d0;
}

.library-selection {
 position:sticky;
 bottom:10px;
 z-index:3;
 padding:14px;
 background:#252a30;
 border:1px solid #555e68;
 border-radius:14px;
 box-shadow:0 8px 25px #0009;
 margin-top:14px;
}

.library-filters {
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:8px;
}

.library-filters .field {
 min-width:0;
 margin:3px 0;
}

.library-section-title {
 font-size:11px;
 color:#9ba3ac;
 letter-spacing:1.5px;
 text-transform:uppercase;
 margin:20px 0 10px;
}

.library-card p {
 margin:6px 0;
}

@media(min-width:700px) {
 .library-categories {
  grid-template-columns:repeat(4,minmax(0,1fr));
 }
}

/* FICHAS TECNICAS */

.exercise-ficha-overlay {
 position:fixed;
 inset:0;
 z-index:1000;
 background:#000d;
 overflow-y:auto;
 padding:15px;
 display:flex;
 justify-content:center;
 align-items:flex-start;
}

.exercise-ficha {
 width:100%;
 max-width:650px;
 margin:20px auto;
 padding:20px;
 background:#15191d;
 border:1px solid #3b424a;

}

.exercise-ficha h1 {
 margin-top:20px;
 font-size:25px;
}

.exercise-ficha-visual {
 min-height:145px;
 margin:20px 0;
 padding:20px;
 display:flex;

}

.exercise-ficha-visual-icon {

}

 font-size:17px;
}

.exercise-ficha-visual p {
 margin:0;
}

.exercise-ficha-section {
 padding:15px 0;
 border-bottom:1px solid #30363d;
}

.exercise-ficha-section h3 {
 color:#e4e8ec;
 margin-bottom:7px;
}

.exercise-ficha-section p {
 margin:0;

}

@media(max-width:450px) {
 .exercise-ficha {
  padding:15px;
 }

 .exercise-ficha-visual {
  padding:14px;
 }

 .exercise-ficha-visual-icon {
  width:65px;
  height:65px;
  font-size:34px;
 }
}

</style>

</head>

<body>

<header>

 <div class="brand">TP <span>TRAINING PLANNER</span></div>

 <div class="sub">PLANIFICACIÓN · SEGUIMIENTO · RENDIMIENTO</div>

</header>

<nav id="nav">

 <button data-page="inicio" class="active">Inicio</button>

 <button data-page="planes">Planificaciones</button>

 <button data-page="clientes">Clientes</button>

 <button data-page="ejercicios">Ejercicios</button>

 <button data-page="estadisticas">Estadísticas</button>

 <button data-page="herramientas">Herramientas</button>

 <button data-page="datos">Datos</button>

</nav>

<main id="app"></main>

<footer>TP TRAINING PLANNER · Tus datos se guardan en este navegador</footer>

<script>

"use strict";

/* DATOS Y COMPATIBILIDAD */

const KEYS={

 plans:"tp_training_planner_v1",

 exercises:"tp_custom_exercises_v1",

 clients:"tp_clients_v1"

};

const read=(key,fallback)=>{

 try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch(e){return fallback}

};

let plans=read(KEYS.plans,[]);

let customExercises=read(KEYS.exercises,[]);

let clients=read(KEYS.clients,[]);

if(!Array.isArray(plans))plans=[];

if(!Array.isArray(customExercises))customExercises=[];

if(!Array.isArray(clients))clients=[];

let page="inicio",selectedPlan=null,selectedClient=null,editingSession=null;

let timerInterval=null,timerSeconds=0;

const methods=["Normal","Serie descendente","Descanso-pausa","Superserie","Triserie","Circuito","Pirámide ascendente","Pirámide descendente","Pirámide doble","Repeticiones con pausa","Serie con ayuda"];

const seriesTypes=["Efectiva","Aproximación","Descarga"];

const muscles=["Pectorales","Espalda","Hombros","Bíceps","Tríceps","Cuádriceps","Isquiotibiales","Glúteos","Gemelos","Abdominales","Antebrazos","Cuerpo completo"];

const equipment=["Peso corporal","Mancuernas","Barra","Máquinas","Poleas","Bandas elásticas","Kettlebell","Otros"];
const movementPatterns=[
 "Empuje horizontal",
 "Empuje vertical",
 "Tracción horizontal",
 "Tracción vertical",
 "Dominante de rodilla",
 "Bisagra de cadera",
 "Dominante de cadera",
 "Unilateral",
 "Rotación",
 "Anti-rotación",
 "Estabilidad",
 "Locomoción",
 "Salto",
 "Lanzamiento",
 "Aislamiento"
];

const trainingTypes=[
 "Fuerza",
 "Hipertrofia",
 "Potencia",
 "Resistencia muscular",
 "Acondicionamiento",
 "Movilidad",
 "Estabilidad",
 "Pliometría",
 "Funcional"
];

const bodyRegions=[
 "Tren superior",
 "Tren inferior",
 "Zona media",
 "Cuerpo completo"
];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const save=()=>{

 localStorage.setItem(KEYS.plans,JSON.stringify(plans));

 localStorage.setItem(KEYS.exercises,JSON.stringify(customExercises));

 localStorage.setItem(KEYS.clients,JSON.stringify(clients));

};

const fmt=n=>Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:1});

const dateNow=()=>new Date().toISOString().slice(0,10);

const getPlan=id=>plans.find(p=>p.id===id);

const getClient=id=>clients.find(c=>c.id===id);

const clone=data=>JSON.parse(JSON.stringify(data));

function normalize(){

 plans.forEach(p=>{

  p.id=p.id||uid();p.days=Array.isArray(p.days)?p.days:[];

  p.days.forEach(d=>{

   d.id=d.id||uid();d.exercises=Array.isArray(d.exercises)?d.exercises:[];

   d.exercises.forEach(e=>{

    e.id=e.id||uid();e.series=Array.isArray(e.series)?e.series:[];

    e.series=e.series.map(s=>({...s,type:s.type||"Efectiva"}));

   });

  });

 });

 clients.forEach(c=>{
  c.id=c.id||uid();

  c.sessions=Array.isArray(c.sessions)?c.sessions:[];

  c.evaluations=Array.isArray(c.evaluations)?c.evaluations:[];

  c.objectives=Array.isArray(c.objectives)?c.objectives:[];

  /* Compatibilidad con clientes de versiones anteriores */

  if(c.trainingPlan&&Array.isArray(c.trainingPlan.days)){

   c.trainingPlan.days.forEach(d=>{

    d.id=d.id||uid();d.exercises=Array.isArray(d.exercises)?d.exercises:[];

    d.exercises.forEach(e=>{

     e.id=e.id||uid();e.series=Array.isArray(e.series)?e.series:[];

     e.series=e.series.map(s=>({...s,type:s.type||"Efectiva"}));

    });

   });

  }

 });

 save();

}

normalize();

/* CADA CLIENTE TIENE SU PROPIA COPIA DE LA PLANIFICACIÓN */

function ensureClientPlan(c){

 if(!c)return null;

 if(c.trainingPlan&&Array.isArray(c.trainingPlan.days))return c.trainingPlan;

 const original=getPlan(c.planId);

 if(original){

  c.trainingPlan=clone(original);

  c.trainingPlan.id=uid();

  c.trainingPlan.sourcePlanId=original.id;

  save();

  return c.trainingPlan;

 }

 return null;

}

function assignPlanToClient(c,planId){

 if(!c)return;

 if(!planId){

  c.planId=null;

  c.trainingPlan=null;

  save();

  return;

 }

 const original=getPlan(planId);

 if(!original)return;

 c.planId=original.id;

 c.trainingPlan=clone(original);

 c.trainingPlan.id=uid();

 c.trainingPlan.sourcePlanId=original.id;

 save();

}

function pageTitle(title,desc=""){

 return `<div class="between"><div><h1>${title}</h1><p>${desc}</p></div></div>`;

}

function field(label,name,value="",type="text",extra=""){

 return `<div class="field"><label>${label}</label><input type="${type}" name="${name}" value="${esc(value)}" ${extra}></div>`;

}

function selectField(label,name,arr,value=""){

 return `<div class="field"><label>${label}</label><select name="${name}">${arr.map(x=>`<option ${x===value?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`;

}

function options(arr){return arr.map(x=>`<option>${esc(x)}</option>`).join("")}

function render(){

 save();

 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));

 const root=document.getElementById("app");

 const pages={inicio,planes:pagePlans,clientes:pageClients,ejercicios:pageExercises,estadisticas,herramientas,datos};

 root.innerHTML=(pages[page]||inicio)();

 if(page==="ejercicios")updateExerciseResults();

 if(page==="herramientas")updateCalculators();

}

/* INICIO */

function inicio(){

 const sessions=clients.reduce((n,c)=>n+c.sessions.length,0);

 const totalEffective=clients.reduce((n,c)=>n+c.sessions.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.series.filter(x=>x.type==="Efectiva").length,0),0),0);

 return `${pageTitle("Panel principal","Resumen de tu actividad como entrenador.")}

 <div class="grid">

  <div class="card"><div class="statlabel">Clientes</div><div class="stat">${clients.length}</div></div>

  <div class="card"><div class="statlabel">Planificaciones</div><div class="stat">${plans.length}</div></div>

  <div class="card"><div class="statlabel">Entrenamientos registrados</div><div class="stat">${sessions}</div></div>

  <div class="card"><div class="statlabel">Series efectivas registradas</div><div class="stat">${totalEffective}</div></div>

 </div>

 <div class="card"><h2>Accesos rápidos</h2><div class="row">

  <button class="btn" data-action="new-plan">+ Nueva planificación</button>

  <button class="btn secondary" data-action="new-client">+ Nuevo cliente</button>

  <button class="btn secondary" data-page="herramientas">Herramientas</button>

 </div></div>

 <div class="card"><h2>Últimos entrenamientos</h2>${recentSessions()}</div>

 <div class="notice">Los datos se guardan en este navegador. Exportá copias de seguridad periódicamente para evitar perder información.</div>`;

}

function recentSessions(){

 let all=[];

 clients.forEach(c=>c.sessions.forEach(s=>all.push({...s,clientName:c.name})));

 all.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

 if(!all.length)return `<div class="empty">Todavía no hay entrenamientos registrados.</div>`;

 return all.slice(0,5).map(s=>`<div class="between"><div><b>${esc(s.clientName)}</b><div class="muted">${esc(s.dayName||"Entrenamiento")} · ${esc(s.date||"")}</div></div><span class="tag">${s.exercises?.length||0} ejercicios</span></div><hr>`).join("");

}

/* PLANIFICACIONES GENERALES */

function pagePlans(){

 if(selectedPlan){

  const p=getPlan(selectedPlan);

  if(!p){selectedPlan=null;return pagePlans()}

  return planEditor(p);

 }

 return `${pageTitle("Planificaciones","Creá y organizá programas de entrenamiento.")}

 <div class="card"><h2>Nueva planificación</h2>

  <form id="planForm">

   <div class="row">${field("Nombre","name","","text","required")}

   <div class="field"><label>Objetivo</label><select name="goal">${options(["Hipertrofia","Fuerza","Resistencia","Salud general","Recomposición corporal","Rendimiento deportivo","Readaptación","Otro"])}</select></div>

   <div class="field"><label>Días por semana</label><select name="frequency">${[2,3,4,5,6].map(n=>`<option>${n}</option>`).join("")}</select></div></div>

   <button class="btn">Crear planificación</button>

  </form>

 </div>

 ${plans.length?plans.map(p=>`<div class="card"><div class="between"><div><h3>${esc(p.name)}</h3><span class="tag">${esc(p.goal||"Sin objetivo")}</span> <span class="pill">${p.frequency||p.days.length} días</span><p>${p.days.length} días · ${p.days.reduce((n,d)=>n+d.exercises.length,0)} ejercicios</p></div><button class="btn" data-action="open-plan" data-id="${p.id}">Abrir</button></div></div>`).join(""):`<div class="empty">Todavía no creaste planificaciones.</div>`}`;

}

function planEditor(p){

 return `${pageTitle(p.name,"Editor de planificación general")}

 <div class="card"><div class="row"><button class="btn secondary" data-action="back-plans">← Volver</button><button class="btn secondary" data-action="rename-plan" data-id="${p.id}">Editar datos</button><button class="btn danger" data-action="delete-plan" data-id="${p.id}">Eliminar</button></div>

 <p>Objetivo: ${esc(p.goal)} · Frecuencia: ${p.frequency} días</p>

 <button class="btn" data-action="add-day" data-id="${p.id}">+ Agregar día</button></div>

 ${p.days.map((d,i)=>`<div class="card">

 <div class="between"><div><h2>${esc(d.name||"Día "+(i+1))}</h2><span class="pill">${d.exercises.length} ejercicios</span></div><div class="row"><button class="btn small secondary" data-action="edit-day" data-id="${d.id}">Editar día</button><button class="btn small danger" data-action="delete-day" data-id="${d.id}">×</button></div></div>

 ${d.notes?`<p>${esc(d.notes)}</p>`:""}

${d.exercises.map((e,j)=>planExerciseCard(e,j,d.id)).join("")}

 <button class="btn secondary" data-action="add-exercise" data-id="${d.id}">+ Agregar ejercicio</button>

 </div>`).join("")}

 <div class="card"><h3>Resumen del plan</h3><p>Series efectivas programadas: <b>${p.days.reduce((n,d)=>n+d.exercises.reduce((a,e)=>a+e.series.filter(s=>s.type==="Efectiva").length,0),0)}</b></p></div>`;

}


function planExerciseCard(e,j,dayId){

 return `<div class="exercise" data-exercise-id="${e.id}" data-day-id="${dayId}" data-owner="plan">

 <div class="between">
 <div><b>${j+1}. ${esc(e.name)}</b>
 <div class="muted">${esc(e.muscle||"Sin grupo muscular")} · ${esc(e.technique||"Normal")}</div>
 </div>

 <div class="row">
 <span class="drag-handle" title="Arrastrar">⠿</span>
 <button class="btn small secondary" data-action="edit-exercise" data-id="${e.id}">Editar</button>
 <button class="btn small danger" data-action="delete-exercise" data-id="${e.id}">×</button>
 </div>
 </div>

 <div class="muted">Descanso: ${esc(e.rest||"—")} · Tempo: ${esc(e.tempo||"—")} · Bloque: ${esc(e.block||"—")}</div>

 ${e.series.map((s,k)=>`<div class="muted">Serie ${k+1}: ${esc(s.weight||0)} kg × ${esc(s.reps||0)} rep · RIR ${esc(s.rir??"—")} · ${esc(s.type||"Efectiva")}</div>`).join("")}

 ${e.notes?`<p>${esc(e.notes)}</p>`:""}

 </div>`;
}


/* CLIENTES */

function pageClients(){

 if(selectedClient){

  const c=getClient(selectedClient);

  if(!c){
   selectedClient=null;
   return pageClients();
  }

  return clientProfile(c);
 }

 return `${pageTitle("Clientes","Perfiles, planificaciones y seguimiento.")}

 <div class="card"><h2>Agregar cliente</h2>

 <form id="clientForm">

 <div class="row">
 ${field("Nombre","name","","text","required")}
 ${field("Edad","age","","number",'min="1" max="110"')}
 ${field("Teléfono / WhatsApp","phone")}
 </div>

 <div class="row">
 ${field("Fecha de inicio","start",dateNow(),"date")}
 <div class="field"><label>Objetivo</label>
 <select name="goal">${options(["Hipertrofia","Fuerza","Salud general","Resistencia","Rendimiento deportivo","Recomposición corporal","Otro"])}</select>
 </div>
 </div>

 <div class="row">
 <div class="field"><label>Nivel de experiencia</label>
 <select name="experience">${options(["Principiante","Intermedio","Avanzado"])}</select>
 </div>
 ${field("Disponibilidad semanal","availability","","text")}
 </div>

 <div class="field"><label>Observaciones iniciales</label>
 <textarea name="notes"></textarea>
 </div>

 <button class="btn">Guardar cliente</button>
 </form></div>

 ${clients.length?clients.map(c=>`<div class="card">
 <div class="between">
 <div>
 <h3>${esc(c.name)}</h3>
 <p>${esc(c.goal||"Sin objetivo")} · Desde ${esc(c.start||"—")}</p>
 </div>
 <button class="btn" data-action="open-client" data-id="${c.id}">Ver ficha</button>
 </div>
 </div>`).join(""):`<div class="empty">Todavía no agregaste clientes.</div>`}`;

}
/* SEGUIMIENTO DE OBJETIVOS */

function objectiveProgress(o){

 const start=Number(o.startValue);
 const target=Number(o.targetValue);
 const current=Number(o.currentValue);

 if(o.metric&&o.startValue!==""&&o.targetValue!==""&&o.currentValue!==""&&Number.isFinite(start)&&Number.isFinite(target)&&Number.isFinite(current)&&target!==start){

  return Math.max(0,Math.min(100,((current-start)/(target-start))*100));

 }

 return null;

}

function objectivesCard(c){

 const objectives=Array.isArray(c.objectives)?c.objectives:[];

 return `
 <div class="card">

 <div class="between">
  <div>
   <h2>Seguimiento de objetivos</h2>
   <p>Establecé metas y registrá el progreso de cada cliente.</p>
  </div>
  <span class="tag">${objectives.length} objetivos</span>
 </div>

 <form id="goalForm" data-client="${c.id}">

  <h3>Agregar nuevo objetivo</h3>

  <div class="row">
   ${field("Nombre del objetivo","name","","text","required")}

   <div class="field">
    <label>Categoría</label>
    <select name="category">
     ${options(["Fuerza","Hipertrofia","Resistencia","Rendimiento deportivo","Salud general","Movilidad","Otro"])}
    </select>
   </div>
  </div>

  <div class="row">
   ${field("Indicador (opcional)","metric","","text")}
   ${field("Valor inicial","startValue","","number",'step="any"')}
  </div>

  <div class="row">

/* RÉCORDS PERSONALES */

function calculatePersonalRecords(c){

 const records={};

 (c.sessions||[]).forEach(session=>{

  (session.exercises||[]).forEach(exercise=>{

   const name=String(exercise.name||"").trim();
   if(!name)return;

   const key=name.toLowerCase();

   (exercise.series||[]).forEach(series=>{

    if(series.type==="Aproximación"||series.type==="Descarga")return;

    const weight=Number(series.weight);
    const reps=Number(series.reps);

    if(!Number.isFinite(weight)||!Number.isFinite(reps)||weight<0||reps<=0)return;

    const previous=records[key];

    if(!previous||weight>previous.weight||(weight===previous.weight&&reps>previous.reps)){

     records[key]={
      name,
      weight,
      reps,
      date:session.date||"Sin fecha"
     };

    }

   });

  });

 });

 return Object.values(records).sort((a,b)=>a.name.localeCompare(b.name));

}

function personalRecordsCard(c){

 const records=calculatePersonalRecords(c);

 return `

  </div>

     <b>${esc(r.name)}</b>

    </div>

    <div class="stat">${fmt(r.weight)} kg × ${fmt(r.reps)}</div>

   </div>
  `).join(""):`

   </div>
  `}

 </div>
 `;
}
/* COMPARACIÓN DE SESIONES */

function sessionMetrics(session){

 const exercises={};

 let totalVolume=0;
 let totalSets=0;
 let totalReps=0;

 (session.exercises||[]).forEach(ex=>{

  const name=String(ex.name||"").trim();
  if(!name)return;

  const key=name.toLowerCase();

  if(!exercises[key]){
   exercises[key]={
    name,
    sets:0,
    reps:0,
    volume:0
   };
  }

  (ex.series||[]).forEach(s=>{

   const weight=Number(s.weight);
   const reps=Number(s.reps);

   if(!Number.isFinite(reps)||reps<=0)return;

   const safeWeight=Number.isFinite(weight)&&weight>0?weight:0;

   const volume=safeWeight*reps;

   exercises[key].sets++;
   exercises[key].reps+=reps;
   exercises[key].volume+=volume;

   totalSets++;
   totalReps+=reps;
   totalVolume+=volume;

  });

 });

 return {
  exercises,
  totalSets,
  totalReps,
  totalVolume
 };

}

function buildSessionComparison(a,b){

 const statsA=sessionMetrics(a);
 const statsB=sessionMetrics(b);

 const difference=statsB.totalVolume-statsA.totalVolume;

 const names=[...new Set([
  ...Object.keys(statsA.exercises),
  ...Object.keys(statsB.exercises)
 ])].sort();

 return `

 <h3>Resultado de la comparación</h3>

 <div class="grid">

  </div>

   <div class="stat">${fmt(statsB.totalVolume)} kg</div>
  </div>

  <div class="exercise">

 </div>

 <h3>Comparación por ejercicio</h3>

 ${names.map(key=>{

  const x=statsA.exercises[key]||{
   name:statsB.exercises[key].name,
   sets:0,
   reps:0,

  };

  const y=statsB.exercises[key]||{
   name:statsA.exercises[key].name,

  const diff=y.volume-x.volume;

function allExercises(){

 return [
  ...defaultExercises.map(x=>({
   name:x[0],
   muscle:x[1],
   equipment:x[2],
   difficulty:x[3]||"No especificada",
   secondaryMuscle:x[4]||"",
   secondaryMuscles:x[4]?[x[4]]:[],
   movementPattern:x[5]||"",
   trainingType:x[6]||"",
   region:x[7]||"",
   custom:false
  })),

  ...customExercises.map(x=>({
   ...x,
   difficulty:x.difficulty||"No especificada",
   secondaryMuscle:x.secondaryMuscle||"",
   secondaryMuscles:Array.isArray(x.secondaryMuscles)
    ?x.secondaryMuscles
    :(x.secondaryMuscle?[x.secondaryMuscle]:[])
  }))
 ];

}


/* TP EXERCISE LIBRARY - SELECCION MULTIPLE */

let librarySelected = [];

function exerciseKey(e){
 return e.custom ? "custom-"+e.id : "default-"+e.name;
}


function updateExerciseResults(){

 const box=document.getElementById("exerciseResults");
 if(!box)return;

 const q=(document.getElementById("exerciseSearch")?.value||"").toLowerCase().trim();
 const muscle=document.getElementById("muscleFilter")?.value||"";
 const equip=document.getElementById("equipmentFilter")?.value||"";
 const difficulty=document.getElementById("difficultyFilter")?.value||"";
 const type=document.getElementById("typeFilter")?.value||"";

 const arr=allExercises().filter(e=>{
  return (
   e.name.toLowerCase().includes(q) &&
   (!muscle||e.muscle===muscle) &&
   (!equip||e.equipment===equip) &&
   (!difficulty||e.difficulty===difficulty) &&
   (!type||(type==="custom"?e.custom:!e.custom))
  );
 });

 box.innerHTML=`
  <div class="between">
   <div>
    <h2>Ejercicios disponibles</h2>
    <span class="library-count">${arr.length} resultados</span>
   </div>
   <span class="tag">${librarySelected.length} seleccionados</span>
  </div>

  ${arr.map(e=>{
   const key=exerciseKey(e);
   const checked=librarySelected.includes(key);

   return `
    <div class="library-card ${checked?"selected":""}">
     <div class="library-card-top">
      <div>
       <b>${esc(e.name)}</b>
       <p>${esc(e.muscle)} · ${esc(e.equipment||"Sin equipamiento")}</p>
      </div>

      <input
       class="library-check"
       type="checkbox"
       data-library-key="${esc(key)}"
       ${checked?"checked":""}
       aria-label="Seleccionar ${esc(e.name)}">
     </div>

     <div class="library-meta">
      <span class="tag">${esc(e.difficulty||"No especificada")}</span>
      ${e.movementPattern?`<span class="pill">${esc(e.movementPattern)}</span>`:""}
      ${e.custom?`<span class="pill">Personalizado</span>`:""}
     </div>

     ${e.secondaryMuscles?.length?
      `<p><b>Secundarios:</b> ${e.secondaryMuscles.map(m=>esc(m)).join(", ")}</p>`:""}

     <div class="row" style="margin-top:12px">
      <button class="btn secondary small"
       type="button"
       data-action="exercise-ficha"
       data-key="${esc(key)}">
       Ver ficha técnica
      </button>
     </div>
    </div>
   `;
  }).join("")||`<div class="empty">No encontramos ejercicios.</div>`}
 `;

 renderLibrarySelection();
}





/* TP - FICHAS TECNICAS INDIVIDUALES */

function getExerciseFichaData(ex){

 const norm=s=>String(s||"").toLowerCase()
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9 ]/g," ")
  .replace(/\s+/g," ").trim();

 const n=norm(ex.name);
 const m=norm(ex.muscle);

 const has=(...words)=>words.some(w=>n.includes(norm(w)));

 const data={
  muscles:ex.muscle||"No especificado",
  secondary:ex.secondaryMuscles?.length
   ?ex.secondaryMuscles
   :(ex.secondaryMuscle?[ex.secondaryMuscle]:[]),
  movement:"Movimiento específico",
  execution:"Realizá el movimiento de forma controlada, manteniendo una postura estable y respetando tu movilidad.",
  errors:"Utilizar impulso, perder estabilidad o realizar un recorrido que no puedas controlar.",
  variants:"Variantes según el equipamiento, agarre, posición y recorrido."
 };

 const set=(movement,execution,errors,variants,secondary)=>{
  data.movement=movement;
  data.execution=execution;
  data.errors=errors;
  data.variants=variants;
  if(secondary)data.secondary=secondary;
 };

 /* PECHO */

 if(m==="pectorales"){

  if(has("flexion","push up")){
   set("Empuje horizontal con peso corporal",
    "Colocá las manos a una distancia ligeramente superior al ancho de hombros. Mantené el cuerpo alineado, descendé flexionando los codos y empujá para regresar.",
    "Dejar caer la cadera, elevar demasiado la pelvis o separar excesivamente los codos.",
    "Flexión inclinada, tradicional, declinada, diamante y con apoyo de rodillas.",
    ["Tríceps","Deltoides anterior","Serrato anterior"]);
  }

  else if(has("apertura","cruce","crossover","contractora","pec deck")){
   set("Aducción horizontal del hombro",
    "Mantené los codos ligeramente flexionados. Abrí los brazos hasta un recorrido cómodo y acercalos frente al pecho sin perder el control.",
    "Estirar completamente los codos, utilizar impulso o forzar el estiramiento.",
    "Aperturas con mancuernas, poleas, máquina y cruces en distintas alturas.",
    ["Deltoides anterior"]);
  }

  else if(has("inclinado")){
   set("Empuje diagonal ascendente",
    "Apoyá la espalda en el banco inclinado. Descendé la carga hacia la zona superior del pecho y empujá siguiendo una trayectoria estable.",
    "Elevar los hombros, arquear excesivamente la espalda o rebotar la carga.",
    "Press inclinado con barra, mancuernas y máquina.",
    ["Deltoides anterior","Tríceps"]);
  }

  else if(has("declinado")){
   set("Empuje diagonal descendente",
    "Estabilizá el cuerpo en el banco declinado. Descendé la carga hacia el pecho y empujá manteniendo el control.",
    "Perder la posición sobre el banco o realizar rebotes.",
    "Press declinado con barra, mancuernas y máquina.",
    ["Tríceps","Deltoides anterior"]);
  }

  else if(has("pullover")){
   set("Extensión de hombro",
    "Mantené los codos ligeramente flexionados. Llevá la carga hacia atrás de forma controlada y regresá sin forzar el hombro.",
    "Modificar excesivamente el ángulo de los codos o arquear la zona lumbar.",
    "Pullover con mancuerna, polea y máquina.",
    ["Dorsal ancho","Tríceps largo","Redondo mayor"]);

 }

 }

 return data;
}

document.addEventListener("click",e=>{

   filter.value=b.dataset.muscle;
   updateExerciseResults();
   document.getElementById("exerciseResults")?.scrollIntoView({behavior:"smooth"});
  }
 }

 if(b.dataset.action==="library-clear"){
  librarySelected=[];
  updateExerciseResults();
 }

 if(b.dataset.action==="library-add-selected"){

  const planId=document.getElementById("libraryPlan")?.value;
  const dayId=document.getElementById("libraryDay")?.value;

  const plan=plans.find(p=>p.id===planId);
  const day=plan?.days.find(d=>d.id===dayId);

  if(!day){
   alert("Seleccioná una planificación y un día.");

  }

  const selected=allExercises().filter(x=>
   librarySelected.includes(exerciseKey(x))
  );

  if(!selected.length){
   alert("Seleccioná al menos un ejercicio.");
   return;
  }

  let added=0;

  selected.forEach(item=>{

   if(day.exercises.some(x=>x.name===item.name))return;

   day.exercises.push({
    id:uid(),
    name:item.name,
    muscle:item.muscle,
    series:[
     {weight:0,reps:10,rir:2,type:"Efectiva"},

     {weight:0,reps:10,rir:2,type:"Efectiva"}
    ],

    tempo:"2-0-2",
    technique:"Normal",
    notes:"",
    block:"A1"
   });

   added++;
  });

  if(!added){
   alert("Los ejercicios seleccionados ya están en ese día.");
   return;
  }

  librarySelected=[];
  save();
  alert(added+" ejercicios agregados correctamente.");
  render();
 }

});


/* ESTADÍSTICAS */

function estadisticas(){

 const total=clients.reduce((n,c)=>n+c.sessions.length,0);

 const effective=clients.reduce((n,c)=>n+c.sessions.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.series.filter(x=>x.type==="Efectiva").length,0),0),0);

 let groups={};

 clients.forEach(c=>c.sessions.forEach(s=>s.exercises.forEach(e=>{

  const count=e.series.filter(x=>x.type==="Efectiva").length;

  groups[e.muscle||"Sin grupo"]=(groups[e.muscle||"Sin grupo"]||0)+count;

 })));

 const rows=Object.entries(groups).sort((a,b)=>b[1]-a[1]);

 return `${pageTitle("Estadísticas","Seguimiento general de tu trabajo.")}

 <div class="grid"><div class="card"><div class="statlabel">Clientes</div><div class="stat">${clients.length}</div></div><div class="card"><div class="statlabel">Sesiones</div><div class="stat">${total}</div></div><div class="card"><div class="statlabel">Series efectivas</div><div class="stat">${effective}</div></div></div>

/* ENVIAR RUTINA POR WHATSAPP */

function sendClientRoutineWhatsApp(c){

 if(!c)return;

 const p=ensureClientPlan(c);

 if(!p){
  alert("Este cliente no tiene una rutina cargada.");
  return;
 }

 let phone=String(c.phone||"").replace(/\D/g,"");

 if(!phone){
  alert("Este cliente no tiene un número de WhatsApp. Editá sus datos y agregalo.");
  return;
 }

 // Adaptar número al formato internacional argentino
 if(phone.startsWith("00"))phone=phone.slice(2);
 if(phone.startsWith("0"))phone=phone.slice(1);

 if(phone.startsWith("54")){
  if(!phone.startsWith("549"))phone="549"+phone.slice(2);
 }else{
  phone="549"+phone;
 }

 const lines=[];

 lines.push("🏋️ RUTINA DE ENTRENAMIENTO");
 lines.push("");
 lines.push("Hola "+c.name+"!");
 lines.push("Te comparto tu rutina.");
 lines.push("");
 lines.push("📋 "+(p.name||"Plan personalizado"));
 lines.push("");

 (p.days||[]).forEach((d,i)=>{

  lines.push("━━━━━━━━━━━━━━");
  lines.push("📌 "+(d.name||"Día "+(i+1)));
  lines.push("");

  (d.exercises||[]).forEach((e,j)=>{

   lines.push((j+1)+". "+e.name);

   (e.series||[]).forEach((s,k)=>{

    lines.push(
     "   Serie "+(k+1)+": "+
     (s.reps??"—")+" rep · "+
     (s.weight??"—")+" kg · "+
     (e.rest||"Sin descanso indicado")
    );

   });

   lines.push("");

  });

  if(!d.exercises?.length){
   lines.push("Sin ejercicios cargados.");
   lines.push("");
  }

 });

 lines.push("¡A entrenar! 💪");

 const message=lines.join("\n");

 const url="https://wa.me/"+phone+"?text="+encodeURIComponent(message);

 window.open(url,"_blank");

}


/* REORDENAR EJERCICIOS */

let draggedExercise = null;
let dragContainer = null;
let dragMoved = false;
let dragStartX = 0;
let dragStartY = 0;

document.addEventListener("pointerdown", e => {
 const handle = e.target.closest(".drag-handle");
 if (!handle) return;

 const card = handle.closest(".exercise[data-exercise-id]");
 if (!card) return;

 draggedExercise = card;
 dragContainer = card.parentElement;
 dragStartX = e.clientX;
 dragStartY = e.clientY;
 dragMoved = false;

 e.preventDefault();
});

document.addEventListener("pointermove", e => {
 if (!draggedExercise || !dragContainer) return;

 const distance = Math.hypot(
  e.clientX - dragStartX,
  e.clientY - dragStartY
 );

 if (distance < 6) return;

 dragMoved = true;
 draggedExercise.classList.add("dragging");

 const target = document.elementFromPoint(
  e.clientX,
  e.clientY
 )?.closest(".exercise[data-exercise-id]");

 if (!target || target === draggedExercise) return;
 if (target.parentElement !== dragContainer) return;

 const rect = target.getBoundingClientRect();
 const after = e.clientY > rect.top + rect.height / 2;

 dragContainer.insertBefore(
  draggedExercise,
  after ? target.nextSibling : target
 );
});

function finishExerciseDrag(){

 if (!draggedExercise) return;

 const card = draggedExercise;
 const container = dragContainer;
 const moved = dragMoved;

 const owner = card.dataset.owner;
 const dayId = card.dataset.dayId;

 card.classList.remove("dragging");

 draggedExercise = null;
 dragContainer = null;
 dragMoved = false;

 if (!moved) return;

 const ids = Array.from(container.children)
  .filter(el => el.matches(".exercise[data-exercise-id]"))
  .map(el => el.dataset.exerciseId);

 if (owner === "plan") {

  const day = plans.flatMap(p => p.days)
   .find(d => d.id === dayId);

  if (!day) return;

  const exercises = new Map(
   day.exercises.map(e => [e.id,e])
  );

  day.exercises = ids
   .map(id => exercises.get(id))
   .filter(Boolean);

  save();
  render();
  return;
 }

 if (owner === "client") {

  const client = getClient(selectedClient);
  const plan = client ? ensureClientPlan(client) : null;
  const day = plan?.days.find(d => d.id === dayId);

  if (!day) return;

  const exercises = new Map(
   day.exercises.map(e => [e.id,e])
  );

  day.exercises = ids
   .map(id => exercises.get(id))
   .filter(Boolean);

  save();
  renderClientPlan();
 }
}

document.addEventListener("pointerup", finishExerciseDrag);
document.addEventListener("pointercancel", finishExerciseDrag);

 <div class="field"><label>Grupo muscular</label><select name="muscle">${muscles.map(x=>`<option ${x===ex.muscle?"selected":""}>${x}</option>`).join("")}</select></div></div>

 <div class="row">${field("Bloque","block",ex.block||"A1")}${field("Descanso","rest",ex.rest||"90 s")}${field("Tempo","tempo",ex.tempo||"2-0-2")}</div>

 <div class="field"><label>Método de entrenamiento</label><select name="technique">${methods.map(x=>`<option ${x===ex.technique?"selected":""}>${x}</option>`).join("")}</select></div>

 <div class="field"><label>Observaciones</label><textarea name="notes">${esc(ex.notes||"")}</textarea></div>

 <h3>Series individuales</h3><div id="seriesEditor">${ex.series.map((s,i)=>seriesEditorRow(s,i)).join("")}</div>

 <button type="button" class="btn secondary" data-action="add-series">+ Agregar serie</button>

 <hr><button class="btn">Guardar ejercicio</button></form></div>`;

 document.getElementById("app").insertAdjacentHTML("beforeend",content);

 document.getElementById("exerciseEditor").scrollIntoView({behavior:"smooth"});

}

function seriesEditorRow(s,i){

 return `<div class="exercise series-row">

 <div class="between"><b>Serie ${i+1}</b><button type="button" class="btn small danger" data-action="remove-series">Eliminar</button></div>

 <div class="series">

 <div><label>Peso kg</label><input type="number" step="0.5" name="weight" value="${esc(s.weight??0)}"></div>

 <div><label>Repeticiones</label><input type="number" name="reps" value="${esc(s.reps??10)}"></div>

 <div><label>RIR</label><input type="number" min="0" max="10" name="rir" value="${esc(s.rir??2)}"></div>

 <div><label>Tipo</label><select name="type">${seriesTypes.map(x=>`<option ${x===(s.type||"Efectiva")?"selected":""}>${x}</option>`).join("")}</select></div>

 </div></div>`;

}

document.addEventListener("click",e=>{

 const b=e.target.closest("[data-action]");if(!b)return;

 if(b.dataset.action==="close-editor"){

  document.getElementById("exerciseEditor")?.remove();

  document.getElementById("clientExerciseEditor")?.remove();

  return;

 }

 if(b.dataset.action==="add-series"){

  const box=document.getElementById("seriesEditor");

  if(box)box.insertAdjacentHTML("beforeend",seriesEditorRow({weight:0,reps:10,rir:2,type:"Efectiva"},box.children.length));

  return;

 }

 if(b.dataset.action==="remove-series"){b.closest(".series-row")?.remove();return}

});

/* GUARDADO DE EJERCICIOS: GENERAL Y PERSONAL */

document.addEventListener("submit",e=>{

 const f=e.target;

 if(f.id!=="planExerciseForm"&&f.id!=="clientExerciseForm")return;

 e.preventDefault();

 const d=Object.fromEntries(new FormData(f).entries());

 const series=[...f.querySelectorAll(".series-row")].map(row=>({

  weight:Number(row.querySelector('[name="weight"]').value||0),

  reps:Number(row.querySelector('[name="reps"]').value||0),

  rir:Number(row.querySelector('[name="rir"]').value||0),

  type:row.querySelector('[name="type"]').value

 }));

 if(!series.length){alert("Agregá al menos una serie.");return}

 const ex={id:f.dataset.exercise||uid(),name:d.name,muscle:d.muscle,block:d.block,rest:d.rest,tempo:d.tempo,technique:d.technique,notes:d.notes,series};

 if(f.id==="planExerciseForm"){

  let found=false;

  plans.forEach(p=>p.days.forEach(day=>{

   const i=day.exercises.findIndex(x=>x.id===ex.id);

   if(i>=0){day.exercises[i]=ex;found=true}

  }));

  if(!found){

   const day=plans.flatMap(p=>p.days).find(x=>x.id===f.dataset.day);

   if(day)day.exercises.push(ex);

  }

  save();document.getElementById("exerciseEditor")?.remove();render();

 }

 if(f.id==="clientExerciseForm"){

  const c=getClient(f.dataset.client),p=ensureClientPlan(c),day=p?.days.find(x=>x.id===f.dataset.day);

  if(!day)return;

  const index=day.exercises.findIndex(x=>x.id===ex.id);

  if(index>=0)day.exercises[index]=ex;else day.exercises.push(ex);

  save();document.getElementById("clientExerciseEditor")?.remove();renderClientPlan();

 }

});

/* SESIONES: SE USA LA RUTINA PERSONAL DEL CLIENTE */

function startSession(clientId){

 const c=getClient(clientId),p=ensureClientPlan(c);if(!c||!p)return;

 const day=p.days.find(d=>d.id===document.getElementById("sessionDay")?.value)||p.days[0];

 if(!day){alert("La rutina personal no tiene días.");return}

 editingSession={id:uid(),date:dateNow(),planId:p.id,dayName:day.name,notes:"",exercises:clone(day.exercises)};

 showSessionEditor(c);

}

function showSessionEditor(c){

 const s=editingSession;

 const html=`<div class="card" id="sessionEditor"><div class="between"><h2>Registrar entrenamiento</h2><button class="btn secondary" data-action="close-session">Cerrar</button></div>

 <p>${esc(c.name)} · ${esc(s.dayName)} · ${esc(s.date)}</p>

 ${s.exercises.map((e,i)=>`<div class="exercise"><b>${esc(e.name)}</b><p>${esc(e.muscle||"")}</p>${e.series.map((x,j)=>`<div class="series"><div><label>Serie ${j+1} · Peso</label><input type="number" step="0.5" data-ex="${i}" data-set="${j}" data-key="weight" value="${esc(x.weight||0)}"></div><div><label>Repeticiones</label><input type="number" data-ex="${i}" data-set="${j}" data-key="reps" value="${esc(x.reps||0)}"></div><div><label>RIR</label><input type="number" data-ex="${i}" data-set="${j}" data-key="rir" value="${esc(x.rir??2)}"></div><div><label>Tipo</label><select data-ex="${i}" data-set="${j}" data-key="type">${seriesTypes.map(t=>`<option ${t===(x.type||"Efectiva")?"selected":""}>${t}</option>`).join("")}</select></div></div>`).join("")}</div>`).join("")||`<div class="empty">Este día no tiene ejercicios cargados.</div>`}

 <div class="field"><label>Observaciones de la sesión</label><textarea id="sessionNotes">${esc(s.notes)}</textarea></div>

 <button class="btn" data-action="save-session" data-client="${c.id}">Guardar entrenamiento</button></div>`;

 document.getElementById("app").insertAdjacentHTML("beforeend",html);

 document.getElementById("sessionEditor").scrollIntoView({behavior:"smooth"});

}

document.addEventListener("change",e=>{

 const el=e.target;if(!el.dataset.ex)return;

 const x=editingSession?.exercises?.[Number(el.dataset.ex)]?.series?.[Number(el.dataset.set)];

 if(x){const key=el.dataset.key;x[key]=key==="type"?el.value:Number(el.value)}

});

document.addEventListener("click",e=>{

 const b=e.target.closest("[data-action]");if(!b)return;

 if(b.dataset.action==="close-session"){editingSession=null;document.getElementById("sessionEditor")?.remove();return}

 if(b.dataset.action==="save-session"){

  const c=getClient(b.dataset.client);if(!c||!editingSession)return;

  editingSession.notes=document.getElementById("sessionNotes").value;

  c.sessions.push(editingSession);editingSession=null;save();render();return;

 }

});

function viewSession(clientId,sessionId){

 const c=getClient(clientId),s=c?.sessions.find(x=>x.id===sessionId);if(!s)return;

 const detail=s.exercises.map(e=>`<div class="exercise"><b>${esc(e.name)}</b>${e.series.map((x,i)=>`<p>Serie ${i+1}: ${esc(x.weight)} kg × ${esc(x.reps)} rep · RIR ${esc(x.rir)} · ${esc(x.type||"Efectiva")}</p>`).join("")}</div>`).join("");

 const box=document.createElement("div");box.className="card";

 box.innerHTML=`<h2>${esc(s.dayName)} · ${esc(s.date)}</h2>${detail}<p>${esc(s.notes||"Sin observaciones")}</p><button class="btn secondary">Cerrar</button>`;

 box.querySelector("button").onclick=()=>box.remove();

 document.getElementById("app").appendChild(box);box.scrollIntoView({behavior:"smooth"});

}

/* IMPORTACIÓN Y EXPORTACIÓN */

function exportData(){

 const data={version:4,exportedAt:new Date().toISOString(),plans,customExercises,clients};

 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});

 const url=URL.createObjectURL(blob),a=document.createElement("a");

 a.href=url;a.download="TP-Training-Planner-respaldo-"+dateNow()+".json";a.click();

 setTimeout(()=>URL.revokeObjectURL(url),1000);

}

function importData(){

 const input=document.getElementById("importFile"),file=input?.files?.[0];

 if(!file){alert("Primero seleccioná un archivo JSON.");return}

 const reader=new FileReader();

 reader.onload=()=>{

  try{

   const d=JSON.parse(reader.result);

   if(!confirm("La importación reemplazará los datos actuales. ¿Continuar?"))return;

   if(Array.isArray(d)){plans=d;customExercises=[];clients=[]}

   else{

    plans=Array.isArray(d.plans)?d.plans:[];

    customExercises=Array.isArray(d.customExercises)?d.customExercises:[];

    clients=Array.isArray(d.clients)?d.clients:[];

   }

   normalize();selectedPlan=null;selectedClient=null;clientPlanEditing=false;

   alert("Copia de seguridad importada.");render();

  }catch(err){alert("El archivo no es válido o está dañado.")}

 };

 reader.readAsText(file);

}

/* TEMPORIZADORES */

function startTimer(){

 if(timerInterval)return;

 const m=Number(document.getElementById("timerMin")?.value||0),s=Number(document.getElementById("timerSec")?.value||0);

 if(timerSeconds<=0)timerSeconds=Math.max(0,m*60+s);

 updateTimer();

 timerInterval=setInterval(()=>{

  timerSeconds=Math.max(0,timerSeconds-1);updateTimer();

  if(timerSeconds===0){clearInterval(timerInterval);timerInterval=null;alert("¡Descanso terminado!")}

 },1000);

}

function startCircuit(){

 const work=Math.max(1,Number(document.getElementById("work")?.value||40));

 const pause=Math.max(0,Number(document.getElementById("pause")?.value||20));

 const rounds=Math.max(1,Number(document.getElementById("rounds")?.value||4));

 const out=document.getElementById("circuitStatus");let round=1,remaining=work,working=true;

 if(timerInterval)clearInterval(timerInterval);

 out.textContent=`Vuelta ${round}/${rounds} · Trabajo · ${remaining} s`;

 timerInterval=setInterval(()=>{

  remaining--;

  if(remaining<=0){

   if(working){working=false;remaining=pause}

   else{round++;if(round>rounds){clearInterval(timerInterval);timerInterval=null;out.textContent="Circuito terminado.";return}working=true;remaining=work}

  }

  out.textContent=`Vuelta ${round}/${rounds} · ${working?"Trabajo":"Pausa"} · ${remaining} s`;

 },1000);

}
