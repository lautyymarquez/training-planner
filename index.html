

<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#101411">

<title>TP Training Planner</title>

<style>

:root{--bg:#101411;--panel:#191f1b;--panel2:#202923;--line:#303b33;--green:#b5f36b;--green2:#8acb43;--text:#f2f5f1;--muted:#9ba79d;--red:#ff7777;--yellow:#f5ca67}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}

button,input,select,textarea{font:inherit}

button{cursor:pointer}

header{padding:20px 18px 14px;background:#151b16;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

.brand{font-size:21px;font-weight:900;letter-spacing:1px}.brand span{color:var(--green)}

.sub{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:2px}

nav{display:flex;gap:7px;overflow-x:auto;padding:12px 14px;background:#151b16;position:sticky;top:68px;z-index:4}

nav button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 13px;border-radius:10px;font-size:12px}

nav button.active{background:var(--green);color:#14200e;border-color:var(--green);font-weight:bold}

main{max-width:1100px;margin:auto;padding:18px 14px 50px}

h1{font-size:24px;margin:5px 0 6px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}

p,.muted{color:var(--muted);font-size:13px;line-height:1.5}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}

.stat{font-size:27px;font-weight:800;color:var(--green);margin-top:7px}

.statlabel{font-size:12px;color:var(--muted)}

.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.field{display:flex;flex-direction:column;gap:6px;margin:9px 0;flex:1;min-width:130px}

label{font-size:12px;color:var(--muted)}

input,select,textarea{width:100%;background:#101612;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;outline:none}

input:focus,select:focus,textarea:focus{border-color:var(--green)}

textarea{min-height:75px;resize:vertical}

.btn{border:0;border-radius:9px;background:var(--green);color:#14200e;padding:11px 14px;font-weight:800;font-size:12px}

.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}

.btn.danger{background:#442323;color:#ffaaaa}

.btn.small{padding:7px 10px;font-size:11px}

.tag{display:inline-block;padding:5px 8px;border-radius:7px;background:#293629;color:var(--green);font-size:11px}

.exercise{border:1px solid var(--line);background:#151b16;border-radius:11px;padding:12px;margin:9px 0}

.series{display:grid;grid-template-columns:repeat(4,minmax(60px,1fr));gap:6px;margin:8px 0}

.series input,.series select{padding:8px;font-size:12px;min-width:0}

table{width:100%;border-collapse:collapse;font-size:12px}

th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}

th{color:var(--muted)}

.hidden{display:none!important}

.notice{border-left:3px solid var(--green);padding:10px 12px;background:#202a20;border-radius:7px;color:#c9d5c8;font-size:12px;margin:12px 0}

.pill{font-size:10px;padding:4px 7px;border-radius:6px;background:#29332c;color:var(--muted)}

hr{border:0;border-top:1px solid var(--line);margin:14px 0}

canvas{width:100%;max-height:230px}

.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}

footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}

@media(min-width:700px){main{padding:25px}.series{grid-template-columns:repeat(4,1fr)}}

</style>

</head>

<body>

<header>

 <div class="brand">TP <span>TRAINING PLANNER</span></div>

 <div class="sub">PLANIFICACIÓN · SEGUIMIENTO · RENDIMIENTO</div>

</header>

<nav id="nav">

 <button data-page="inicio" class="active">Inicio</button>

 <button data-page="planes">Planificaciones</button>

 <button data-page="clientes">Clientes</button>

 <button data-page="ejercicios">Ejercicios</button>

 <button data-page="estadisticas">Estadísticas</button>

 <button data-page="herramientas">Herramientas</button>

 <button data-page="datos">Datos</button>

</nav>

<main id="app"></main>

<footer>TP TRAINING PLANNER · Tus datos se guardan en este navegador</footer>

<script>

"use strict";

/* DATOS Y COMPATIBILIDAD */

const KEYS={

 plans:"tp_training_planner_v1",

 exercises:"tp_custom_exercises_v1",

 clients:"tp_clients_v1"

};

const read=(key,fallback)=>{

 try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch(e){return fallback}

};

let plans=read(KEYS.plans,[]);

let customExercises=read(KEYS.exercises,[]);

let clients=read(KEYS.clients,[]);

if(!Array.isArray(plans))plans=[];

if(!Array.isArray(customExercises))customExercises=[];

if(!Array.isArray(clients))clients=[];

let page="inicio",selectedPlan=null,selectedClient=null,editingSession=null;

let timerInterval=null,timerSeconds=0;

const methods=["Normal","Serie descendente","Descanso-pausa","Superserie","Triserie","Circuito","Pirámide ascendente","Pirámide descendente","Pirámide doble","Repeticiones con pausa","Serie con ayuda"];

const seriesTypes=["Efectiva","Aproximación","Descarga"];

const muscles=["Pectorales","Espalda","Hombros","Bíceps","Tríceps","Cuádriceps","Isquiotibiales","Glúteos","Gemelos","Abdominales","Antebrazos","Cuerpo completo"];

const equipment=["Peso corporal","Mancuernas","Barra","Máquinas","Poleas","Bandas elásticas","Kettlebell","Otros"];

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const save=()=>{

 localStorage.setItem(KEYS.plans,JSON.stringify(plans));

 localStorage.setItem(KEYS.exercises,JSON.stringify(customExercises));

 localStorage.setItem(KEYS.clients,JSON.stringify(clients));

};

const fmt=n=>Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:1});

const dateNow=()=>new Date().toISOString().slice(0,10);

const getPlan=id=>plans.find(p=>p.id===id);

const getClient=id=>clients.find(c=>c.id===id);

const clone=data=>JSON.parse(JSON.stringify(data));

function normalize(){

 plans.forEach(p=>{

  p.id=p.id||uid();p.days=Array.isArray(p.days)?p.days:[];

  p.days.forEach(d=>{

   d.id=d.id||uid();d.exercises=Array.isArray(d.exercises)?d.exercises:[];

   d.exercises.forEach(e=>{

    e.id=e.id||uid();e.series=Array.isArray(e.series)?e.series:[];

    e.series=e.series.map(s=>({...s,type:s.type||"Efectiva"}));

   });

  });

 });

 clients.forEach(c=>{

  c.id=c.id||uid();

  c.sessions=Array.isArray(c.sessions)?c.sessions:[];

  c.evaluations=Array.isArray(c.evaluations)?c.evaluations:[];

  /* Compatibilidad con clientes de versiones anteriores */

  if(c.trainingPlan&&Array.isArray(c.trainingPlan.days)){

   c.trainingPlan.days.forEach(d=>{

    d.id=d.id||uid();d.exercises=Array.isArray(d.exercises)?d.exercises:[];

    d.exercises.forEach(e=>{

     e.id=e.id||uid();e.series=Array.isArray(e.series)?e.series:[];

     e.series=e.series.map(s=>({...s,type:s.type||"Efectiva"}));

    });

   });

  }

 });

 save();

}

normalize();

/* CADA CLIENTE TIENE SU PROPIA COPIA DE LA PLANIFICACIÓN */

function ensureClientPlan(c){

 if(!c)return null;

 if(c.trainingPlan&&Array.isArray(c.trainingPlan.days))return c.trainingPlan;

 const original=getPlan(c.planId);

 if(original){

  c.trainingPlan=clone(original);

  c.trainingPlan.id=uid();

  c.trainingPlan.sourcePlanId=original.id;

  save();

  return c.trainingPlan;

 }

 return null;

}

function assignPlanToClient(c,planId){

 if(!c)return;

 if(!planId){

  c.planId=null;

  c.trainingPlan=null;

  save();

  return;

 }

 const original=getPlan(planId);

 if(!original)return;

 c.planId=original.id;

 c.trainingPlan=clone(original);

 c.trainingPlan.id=uid();

 c.trainingPlan.sourcePlanId=original.id;

 save();

}

function pageTitle(title,desc=""){

 return `<div class="between"><div><h1>${title}</h1><p>${desc}</p></div></div>`;

}

function field(label,name,value="",type="text",extra=""){

 return `<div class="field"><label>${label}</label><input type="${type}" name="${name}" value="${esc(value)}" ${extra}></div>`;

}

function selectField(label,name,arr,value=""){

 return `<div class="field"><label>${label}</label><select name="${name}">${arr.map(x=>`<option ${x===value?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`;

}

function options(arr){return arr.map(x=>`<option>${esc(x)}</option>`).join("")}

function render(){

 save();

 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));

 const root=document.getElementById("app");

 const pages={inicio,planes:pagePlans,clientes:pageClients,ejercicios:pageExercises,estadisticas,herramientas,datos};

 root.innerHTML=(pages[page]||inicio)();

 if(page==="ejercicios")updateExerciseResults();

 if(page==="herramientas")updateCalculators();

}

/* INICIO */

function inicio(){

 const sessions=clients.reduce((n,c)=>n+c.sessions.length,0);

 const totalEffective=clients.reduce((n,c)=>n+c.sessions.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.series.filter(x=>x.type==="Efectiva").length,0),0),0);

 return `${pageTitle("Panel principal","Resumen de tu actividad como entrenador.")}

 <div class="grid">

  <div class="card"><div class="statlabel">Clientes</div><div class="stat">${clients.length}</div></div>

  <div class="card"><div class="statlabel">Planificaciones</div><div class="stat">${plans.length}</div></div>

  <div class="card"><div class="statlabel">Entrenamientos registrados</div><div class="stat">${sessions}</div></div>

  <div class="card"><div class="statlabel">Series efectivas registradas</div><div class="stat">${totalEffective}</div></div>

 </div>

 <div class="card"><h2>Accesos rápidos</h2><div class="row">

  <button class="btn" data-action="new-plan">+ Nueva planificación</button>

  <button class="btn secondary" data-action="new-client">+ Nuevo cliente</button>

  <button class="btn secondary" data-page="herramientas">Herramientas</button>

 </div></div>

 <div class="card"><h2>Últimos entrenamientos</h2>${recentSessions()}</div>

 <div class="notice">Los datos se guardan en este navegador. Exportá copias de seguridad periódicamente para evitar perder información.</div>`;

}

function recentSessions(){

 let all=[];

 clients.forEach(c=>c.sessions.forEach(s=>all.push({...s,clientName:c.name})));

 all.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

 if(!all.length)return `<div class="empty">Todavía no hay entrenamientos registrados.</div>`;

 return all.slice(0,5).map(s=>`<div class="between"><div><b>${esc(s.clientName)}</b><div class="muted">${esc(s.dayName||"Entrenamiento")} · ${esc(s.date||"")}</div></div><span class="tag">${s.exercises?.length||0} ejercicios</span></div><hr>`).join("");

}

/* PLANIFICACIONES GENERALES */

function pagePlans(){

 if(selectedPlan){

  const p=getPlan(selectedPlan);

  if(!p){selectedPlan=null;return pagePlans()}

  return planEditor(p);

 }

 return `${pageTitle("Planificaciones","Creá y organizá programas de entrenamiento.")}

 <div class="card"><h2>Nueva planificación</h2>

  <form id="planForm">

   <div class="row">${field("Nombre","name","","text","required")}

   <div class="field"><label>Objetivo</label><select name="goal">${options(["Hipertrofia","Fuerza","Resistencia","Salud general","Recomposición corporal","Rendimiento deportivo","Readaptación","Otro"])}</select></div>

   <div class="field"><label>Días por semana</label><select name="frequency">${[2,3,4,5,6].map(n=>`<option>${n}</option>`).join("")}</select></div></div>

   <button class="btn">Crear planificación</button>

  </form>

 </div>

 ${plans.length?plans.map(p=>`<div class="card"><div class="between"><div><h3>${esc(p.name)}</h3><span class="tag">${esc(p.goal||"Sin objetivo")}</span> <span class="pill">${p.frequency||p.days.length} días</span><p>${p.days.length} días · ${p.days.reduce((n,d)=>n+d.exercises.length,0)} ejercicios</p></div><button class="btn" data-action="open-plan" data-id="${p.id}">Abrir</button></div></div>`).join(""):`<div class="empty">Todavía no creaste planificaciones.</div>`}`;

}

function planEditor(p){

 return `${pageTitle(p.name,"Editor de planificación general")}

 <div class="card"><div class="row"><button class="btn secondary" data-action="back-plans">← Volver</button><button class="btn secondary" data-action="rename-plan" data-id="${p.id}">Editar datos</button><button class="btn danger" data-action="delete-plan" data-id="${p.id}">Eliminar</button></div>

 <p>Objetivo: ${esc(p.goal)} · Frecuencia: ${p.frequency} días</p>

 <button class="btn" data-action="add-day" data-id="${p.id}">+ Agregar día</button></div>

 ${p.days.map((d,i)=>`<div class="card">

 <div class="between"><div><h2>${esc(d.name||"Día "+(i+1))}</h2><span class="pill">${d.exercises.length} ejercicios</span></div><div class="row"><button class="btn small secondary" data-action="edit-day" data-id="${d.id}">Editar día</button><button class="btn small danger" data-action="delete-day" data-id="${d.id}">×</button></div></div>

 ${d.notes?`<p>${esc(d.notes)}</p>`:""}

 ${d.exercises.map((e,j)=>planExerciseCard(e,j)).join("")}

 <button class="btn secondary" data-action="add-exercise" data-id="${d.id}">+ Agregar ejercicio</button>

 </div>`).join("")}

 <div class="card"><h3>Resumen del plan</h3><p>Series efectivas programadas: <b>${p.days.reduce((n,d)=>n+d.exercises.reduce((a,e)=>a+e.series.filter(s=>s.type==="Efectiva").length,0),0)}</b></p></div>`;

}

function planExerciseCard(e,j){

 return `<div class="exercise">

 <div class="between"><div><b>${j+1}. ${esc(e.name)}</b><div class="muted">${esc(e.muscle||"Sin grupo muscular")} · ${esc(e.technique||"Normal")}</div></div>

 <div class="row"><button class="btn small secondary" data-action="edit-exercise" data-id="${e.id}">Editar</button><button class="btn small danger" data-action="delete-exercise" data-id="${e.id}">×</button></div></div>

 <div class="muted">Descanso: ${esc(e.rest||"—")} · Tempo: ${esc(e.tempo||"—")} · Bloque: ${esc(e.block||"—")}</div>

 ${e.series.map((s,k)=>`<div class="muted">Serie ${k+1}: ${esc(s.weight||0)} kg × ${esc(s.reps||0)} rep · RIR ${esc(s.rir??"—")} · ${esc(s.type||"Efectiva")}</div>`).join("")}

 ${e.notes?`<p>${esc(e.notes)}</p>`:""}

 </div>`;

}

/* CLIENTES */

function pageClients(){

 if(selectedClient){

  const c=getClient(selectedClient);

  if(!c){
   selectedClient=null;
   return pageClients();
  }

  return clientProfile(c);
 }

 return `${pageTitle("Clientes","Perfiles, planificaciones y seguimiento.")}

 <div class="card"><h2>Agregar cliente</h2>

 <form id="clientForm">

 <div class="row">
 ${field("Nombre","name","","text","required")}
 ${field("Edad","age","","number",'min="1" max="110"')}
 ${field("Teléfono / WhatsApp","phone")}
 </div>

 <div class="row">
 ${field("Fecha de inicio","start",dateNow(),"date")}
 <div class="field"><label>Objetivo</label>
 <select name="goal">${options(["Hipertrofia","Fuerza","Salud general","Resistencia","Rendimiento deportivo","Recomposición corporal","Otro"])}</select>
 </div>
 </div>

 <div class="row">
 <div class="field"><label>Nivel de experiencia</label>
 <select name="experience">${options(["Principiante","Intermedio","Avanzado"])}</select>
 </div>
 ${field("Disponibilidad semanal","availability","","text")}
 </div>

 <div class="field"><label>Observaciones iniciales</label>
 <textarea name="notes"></textarea>
 </div>

 <button class="btn">Guardar cliente</button>
 </form></div>

 ${clients.length?clients.map(c=>`<div class="card">
 <div class="between">
 <div>
 <h3>${esc(c.name)}</h3>
 <p>${esc(c.goal||"Sin objetivo")} · Desde ${esc(c.start||"—")}</p>
 </div>
 <button class="btn" data-action="open-client" data-id="${c.id}">Ver ficha</button>
 </div>
 </div>`).join(""):`<div class="empty">Todavía no agregaste clientes.</div>`}`;

}

function clientProfile(c){

 const p=ensureClientPlan(c);

 return `${pageTitle(c.name,"Ficha individual del cliente")}

 <div class="card"><div class="row">
 <button class="btn secondary" data-action="back-clients">← Volver</button>
 <button class="btn secondary" data-action="edit-client" data-id="${c.id}">Editar ficha</button>
 <button class="btn danger" data-action="delete-client" data-id="${c.id}">Eliminar</button>
 </div>

 <p><b>Edad:</b> ${esc(c.age||"No registrada")} años</p>
 <p><b>Teléfono / WhatsApp:</b> ${esc(c.phone||"No registrado")}</p>
 <p><b>Objetivo:</b> ${esc(c.goal||"—")}</p>
 <p><b>Experiencia:</b> ${esc(c.experience||"No registrada")}</p>
 <p><b>Disponibilidad:</b> ${esc(c.availability||"No registrada")}</p>
 <p><b>Fecha de inicio:</b> ${esc(c.start||"—")}</p>
 <p><b>Observaciones:</b> ${esc(c.notes||"Sin observaciones")}</p>

 <div class="field">
 <label>Asignar una planificación como punto de partida</label>
 <select id="assignPlan">
 <option value="">Sin planificación</option>
 ${plans.map(x=>`<option value="${x.id}" ${c.planId===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}
 </select>
 </div>

 <button class="btn secondary" data-action="assign-plan" data-id="${c.id}">Asignar / reemplazar planificación</button>

 <div class="notice">Al asignar una planificación se crea una copia exclusiva para este cliente. Los cambios que hagas en su rutina no modifican el plan general ni a otros clientes.</div>
 </div>

 <div class="card">
 <div class="between">
 <h2>Entrenamiento personal</h2>
 <button class="btn" data-action="edit-client-plan" data-id="${c.id}">Editar entrenamiento</button>
 </div>

 ${p?`<p><b>${esc(p.name||"Plan personalizado")}</b> · ${p.days.length} días · ${p.days.reduce((n,d)=>n+d.exercises.length,0)} ejercicios</p>

 ${p.days.map(d=>`<div class="exercise">
 <b>${esc(d.name)}</b>
 <p>${d.exercises.length} ejercicios</p>
 </div>`).join("")||`<div class="empty">Todavía no agregaste días.</div>`}`:`<p>Este cliente todavía no tiene una rutina. Podés asignarle una planificación o crear una desde cero.</p>`}

 <button class="btn secondary" data-action="create-client-plan" data-id="${c.id}">Crear rutina desde cero</button>
 </div>

 <div class="card">
 <h2>Registrar entrenamiento</h2>

 ${p&&p.days.length?`
 <div class="field">
 <label>Día de la planificación personal</label>
 <select id="sessionDay">
 ${p.days.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")}
 </select>
 </div>
 <button class="btn" data-action="start-session" data-id="${c.id}">Iniciar entrenamiento</button>
 `:`<p>Agregá días a la rutina personal para poder registrar sesiones.</p>`}

 </div>

 <div class="card">
 <h2>Evaluaciones</h2>

 <form id="evaluationForm" data-client="${c.id}">

 <div class="row">
 ${field("Fecha","date",dateNow(),"date")}
 ${field("Peso (kg)","weight","","number",'step="0.1"')}
 ${field("Observación","note")}
 </div>

 <div class="row">
 ${field("Indicador adicional","metric")}
 ${field("Valor","value")}
 </div>

 <button class="btn secondary">Guardar evaluación</button>
 </form>

 ${c.evaluations.length?c.evaluations.slice().reverse().map(e=>`
 <div class="exercise">
 <b>${esc(e.date)}</b>
 <p>Peso: ${esc(e.weight||"—")} kg · ${esc(e.metric||"")}: ${esc(e.value||"—")}</p>
 <p>${esc(e.note||"")}</p>
 </div>`).join(""):`<div class="empty">Sin evaluaciones registradas.</div>`}

 </div>

 <div class="card">
 <h2>Historial de entrenamientos</h2>

 ${c.sessions.length?c.sessions.slice().reverse().map(s=>`
 <div class="exercise">
 <div class="between">
 <div>
 <b>${esc(s.dayName)}</b>
 <p>${esc(s.date)}</p>
 </div>
 <div class="row">
 <button class="btn small secondary" data-action="view-session" data-client="${c.id}" data-id="${s.id}">Ver</button>
 <button class="btn small danger" data-action="delete-session" data-client="${c.id}" data-id="${s.id}">×</button>
 </div>
 </div>
 </div>`).join(""):`<div class="empty">Todavía no hay sesiones registradas.</div>`}

 </div>`;

}

function clientPlanEditor(c){

 const p=ensureClientPlan(c);

 if(!p)return `<div class="card"><button class="btn secondary" data-action="back-client-plan">← Volver</button><p>No hay una rutina cargada.</p></div>`;

 return `${pageTitle("Rutina de "+c.name,"Esta planificación pertenece únicamente a este cliente.")}

 <div class="card"><div class="row">

 <button class="btn secondary" data-action="back-client-plan">← Volver a la ficha</button>

 <button class="btn secondary" data-action="rename-client-plan" data-id="${c.id}">Editar datos</button>

 <button class="btn" data-action="cp-add-day" data-id="${c.id}">+ Agregar día</button>

 </div>

 <div class="notice">Podés cambiar ejercicios, series, pesos, repeticiones, RIR, métodos y descansos. Los cambios se guardan en la ficha de este cliente.</div>

function estadisticas(){

 const targetDay=dayId||plans.find(p=>p.id===selectedPlan)?.days.find(d=>d.exercises.some(e=>e.id===exerciseId))?.id;

 const d=plans.flatMap(p=>p.days).find(x=>x.id===targetDay);

 if(!existing&&!d)return;

 const ex=existing||{id:uid(),name:"",muscle:"Pectorales",series:[{weight:0,reps:10,rir:2,type:"Efectiva"}],rest:"90 s",tempo:"2-0-2",technique:"Normal",notes:"",block:"A1"};

 const content=`<div class="card" id="exerciseEditor"><div class="between"><h2>${existing?"Editar ejercicio":"Agregar ejercicio"}</h2><button class="btn secondary" data-action="close-editor">Cerrar</button></div>

 <form id="planExerciseForm" data-exercise="${existing?.id||""}" data-day="${d?.id||targetDay||""}">

 <div class="row"><div class="field"><label>Ejercicio</label><input name="name" list="exerciseOptions" value="${esc(ex.name)}" required><datalist id="exerciseOptions">${allExercises().map(x=>`<option value="${esc(x.name)}">`).join("")}</datalist></div>

 <div class="field"><label>Grupo muscular</label><select name="muscle">${muscles.map(x=>`<option ${x===ex.muscle?"selected":""}>${x}</option>`).join("")}</select></div></div>

 <div class="row">${field("Bloque","block",ex.block||"A1")}${field("Descanso","rest",ex.rest||"90 s")}${field("Tempo","tempo",ex.tempo||"2-0-2")}</div>

 <div class="field"><label>Método de entrenamiento</label><select name="technique">${methods.map(x=>`<option ${x===ex.technique?"selected":""}>${x}</option>`).join("")}</select></div>

 <div class="field"><label>Observaciones</label><textarea name="notes">${esc(ex.notes||"")}</textarea></div>

 <h3>Series individuales</h3><div id="seriesEditor">${ex.series.map((s,i)=>seriesEditorRow(s,i)).join("")}</div>

 <button type="button" class="btn secondary" data-action="add-series">+ Agregar serie</button>

 <hr><button class="btn">Guardar ejercicio</button></form></div>`;

 document.getElementById("app").insertAdjacentHTML("beforeend",content);

 document.getElementById("exerciseEditor").scrollIntoView({behavior:"smooth"});

}

function seriesEditorRow(s,i){

 return `<div class="exercise series-row">

 <div class="between"><b>Serie ${i+1}</b><button type="button" class="btn small danger" data-action="remove-series">Eliminar</button></div>

 <div class="series">

 <div><label>Peso kg</label><input type="number" step="0.5" name="weight" value="${esc(s.weight??0)}"></div>

 <div><label>Repeticiones</label><input type="number" name="reps" value="${esc(s.reps??10)}"></div>

 <div><label>RIR</label><input type="number" min="0" max="10" name="rir" value="${esc(s.rir??2)}"></div>

 <div><label>Tipo</label><select name="type">${seriesTypes.map(x=>`<option ${x===(s.type||"Efectiva")?"selected":""}>${x}</option>`).join("")}</select></div>

 </div></div>`;

}

document.addEventListener("click",e=>{

 const b=e.target.closest("[data-action]");if(!b)return;

 if(b.dataset.action==="close-editor"){

  document.getElementById("exerciseEditor")?.remove();

  document.getElementById("clientExerciseEditor")?.remove();

  return;

 }

 if(b.dataset.action==="add-series"){

  const box=document.getElementById("seriesEditor");

  if(box)box.insertAdjacentHTML("beforeend",seriesEditorRow({weight:0,reps:10,rir:2,type:"Efectiva"},box.children.length));

  return;

 }

 if(b.dataset.action==="remove-series"){b.closest(".series-row")?.remove();return}

});

/* GUARDADO DE EJERCICIOS: GENERAL Y PERSONAL */

document.addEventListener("submit",e=>{

 const f=e.target;

 if(f.id!=="planExerciseForm"&&f.id!=="clientExerciseForm")return;

 e.preventDefault();

 const d=Object.fromEntries(new FormData(f).entries());

 const series=[...f.querySelectorAll(".series-row")].map(row=>({

  weight:Number(row.querySelector('[name="weight"]').value||0),

  reps:Number(row.querySelector('[name="reps"]').value||0),

  rir:Number(row.querySelector('[name="rir"]').value||0),

  type:row.querySelector('[name="type"]').value

 }));

 if(!series.length){alert("Agregá al menos una serie.");return}

 const ex={id:f.dataset.exercise||uid(),name:d.name,muscle:d.muscle,block:d.block,rest:d.rest,tempo:d.tempo,technique:d.technique,notes:d.notes,series};

 if(f.id==="planExerciseForm"){

  let found=false;

  plans.forEach(p=>p.days.forEach(day=>{

   const i=day.exercises.findIndex(x=>x.id===ex.id);

   if(i>=0){day.exercises[i]=ex;found=true}

  }));

  if(!found){

   const day=plans.flatMap(p=>p.days).find(x=>x.id===f.dataset.day);

   if(day)day.exercises.push(ex);

  }

  save();document.getElementById("exerciseEditor")?.remove();render();

 }

 if(f.id==="clientExerciseForm"){

  const c=getClient(f.dataset.client),p=ensureClientPlan(c),day=p?.days.find(x=>x.id===f.dataset.day);

  if(!day)return;

  const index=day.exercises.findIndex(x=>x.id===ex.id);

  if(index>=0)day.exercises[index]=ex;else day.exercises.push(ex);

  save();document.getElementById("clientExerciseEditor")?.remove();renderClientPlan();

 }

});

/* SESIONES: SE USA LA RUTINA PERSONAL DEL CLIENTE */

function startSession(clientId){

 const c=getClient(clientId),p=ensureClientPlan(c);if(!c||!p)return;

 const day=p.days.find(d=>d.id===document.getElementById("sessionDay")?.value)||p.days[0];

 if(!day){alert("La rutina personal no tiene días.");return}

 editingSession={id:uid(),date:dateNow(),planId:p.id,dayName:day.name,notes:"",exercises:clone(day.exercises)};

 showSessionEditor(c);

}

function showSessionEditor(c){

 const s=editingSession;

 const html=`<div class="card" id="sessionEditor"><div class="between"><h2>Registrar entrenamiento</h2><button class="btn secondary" data-action="close-session">Cerrar</button></div>

 <p>${esc(c.name)} · ${esc(s.dayName)} · ${esc(s.date)}</p>

 ${s.exercises.map((e,i)=>`<div class="exercise"><b>${esc(e.name)}</b><p>${esc(e.muscle||"")}</p>${e.series.map((x,j)=>`<div class="series"><div><label>Serie ${j+1} · Peso</label><input type="number" step="0.5" data-ex="${i}" data-set="${j}" data-key="weight" value="${esc(x.weight||0)}"></div><div><label>Repeticiones</label><input type="number" data-ex="${i}" data-set="${j}" data-key="reps" value="${esc(x.reps||0)}"></div><div><label>RIR</label><input type="number" data-ex="${i}" data-set="${j}" data-key="rir" value="${esc(x.rir??2)}"></div><div><label>Tipo</label><select data-ex="${i}" data-set="${j}" data-key="type">${seriesTypes.map(t=>`<option ${t===(x.type||"Efectiva")?"selected":""}>${t}</option>`).join("")}</select></div></div>`).join("")}</div>`).join("")||`<div class="empty">Este día no tiene ejercicios cargados.</div>`}

 <div class="field"><label>Observaciones de la sesión</label><textarea id="sessionNotes">${esc(s.notes)}</textarea></div>

 <button class="btn" data-action="save-session" data-client="${c.id}">Guardar entrenamiento</button></div>`;

 document.getElementById("app").insertAdjacentHTML("beforeend",html);

 document.getElementById("sessionEditor").scrollIntoView({behavior:"smooth"});

}

document.addEventListener("change",e=>{

 const el=e.target;if(!el.dataset.ex)return;

 const x=editingSession?.exercises?.[Number(el.dataset.ex)]?.series?.[Number(el.dataset.set)];

 if(x){const key=el.dataset.key;x[key]=key==="type"?el.value:Number(el.value)}

});

document.addEventListener("click",e=>{

 const b=e.target.closest("[data-action]");if(!b)return;

 if(b.dataset.action==="close-session"){editingSession=null;document.getElementById("sessionEditor")?.remove();return}

 if(b.dataset.action==="save-session"){

  const c=getClient(b.dataset.client);if(!c||!editingSession)return;

  editingSession.notes=document.getElementById("sessionNotes").value;

  c.sessions.push(editingSession);editingSession=null;save();render();return;

 }

});

function viewSession(clientId,sessionId){

 const c=getClient(clientId),s=c?.sessions.find(x=>x.id===sessionId);if(!s)return;

 const detail=s.exercises.map(e=>`<div class="exercise"><b>${esc(e.name)}</b>${e.series.map((x,i)=>`<p>Serie ${i+1}: ${esc(x.weight)} kg × ${esc(x.reps)} rep · RIR ${esc(x.rir)} · ${esc(x.type||"Efectiva")}</p>`).join("")}</div>`).join("");

 const box=document.createElement("div");box.className="card";

 box.innerHTML=`<h2>${esc(s.dayName)} · ${esc(s.date)}</h2>${detail}<p>${esc(s.notes||"Sin observaciones")}</p><button class="btn secondary">Cerrar</button>`;

 box.querySelector("button").onclick=()=>box.remove();

 document.getElementById("app").appendChild(box);box.scrollIntoView({behavior:"smooth"});

}

/* IMPORTACIÓN Y EXPORTACIÓN */

function exportData(){

 const data={version:4,exportedAt:new Date().toISOString(),plans,customExercises,clients};

 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});

 const url=URL.createObjectURL(blob),a=document.createElement("a");

 a.href=url;a.download="TP-Training-Planner-respaldo-"+dateNow()+".json";a.click();

 setTimeout(()=>URL.revokeObjectURL(url),1000);

}

function importData(){

 const input=document.getElementById("importFile"),file=input?.files?.[0];

 if(!file){alert("Primero seleccioná un archivo JSON.");return}

 const reader=new FileReader();

 reader.onload=()=>{

  try{

   const d=JSON.parse(reader.result);

   if(!confirm("La importación reemplazará los datos actuales. ¿Continuar?"))return;

   if(Array.isArray(d)){plans=d;customExercises=[];clients=[]}

   else{

    plans=Array.isArray(d.plans)?d.plans:[];

    customExercises=Array.isArray(d.customExercises)?d.customExercises:[];

    clients=Array.isArray(d.clients)?d.clients:[];

   }

   normalize();selectedPlan=null;selectedClient=null;clientPlanEditing=false;

   alert("Copia de seguridad importada.");render();

  }catch(err){alert("El archivo no es válido o está dañado.")}

 };

 reader.readAsText(file);

}

/* TEMPORIZADORES */

function startTimer(){

 if(timerInterval)return;

 const m=Number(document.getElementById("timerMin")?.value||0),s=Number(document.getElementById("timerSec")?.value||0);

 if(timerSeconds<=0)timerSeconds=Math.max(0,m*60+s);

 updateTimer();

 timerInterval=setInterval(()=>{

  timerSeconds=Math.max(0,timerSeconds-1);updateTimer();

  if(timerSeconds===0){clearInterval(timerInterval);timerInterval=null;alert("¡Descanso terminado!")}

 },1000);

}

function startCircuit(){

 const work=Math.max(1,Number(document.getElementById("work")?.value||40));

 const pause=Math.max(0,Number(document.getElementById("pause")?.value||20));

 const rounds=Math.max(1,Number(document.getElementById("rounds")?.value||4));

 const out=document.getElementById("circuitStatus");let round=1,remaining=work,working=true;

 if(timerInterval)clearInterval(timerInterval);

 out.textContent=`Vuelta ${round}/${rounds} · Trabajo · ${remaining} s`;

 timerInterval=setInterval(()=>{

  remaining--;

  if(remaining<=0){

   if(working){working=false;remaining=pause}

   else{round++;if(round>rounds){clearInterval(timerInterval);timerInterval=null;out.textContent="Circuito terminado.";return}working=true;remaining=work}

  }

  out.textContent=`Vuelta ${round}/${rounds} · ${working?"Trabajo":"Pausa"} · ${remaining} s`;

 },1000);

}

 if(["exerciseSearch","muscleFilter"].includes(e.target.id))updateExerciseResults();

});

render();
