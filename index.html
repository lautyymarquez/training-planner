

<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#10120f">

<title>TP. Training Planner</title>

<style>

:root {

  --bg:#10120f;

  --panel:#1b1e19;

  --panel2:#232720;

  --border:#30362d;

  --green:#b6f34a;

  --white:#f5f5f5;

  --gray:#999e94;

  --red:#ff6464;

}

* {box-sizing:border-box}

body {

  margin:0;

  background:var(--bg);

  color:var(--white);

  font-family:Arial,sans-serif;

}

header {

  padding:20px;

  border-bottom:1px solid var(--border);

  position:sticky;

  top:0;

  background:var(--bg);

  z-index:5;

}

.logo {font-weight:900;font-size:20px;letter-spacing:1px}

.logo span {color:var(--green)}

main {

  max-width:850px;

  margin:auto;

  padding:22px 16px 110px;

}

h1 {font-size:27px;margin:8px 0}

h2 {font-size:21px}

h3 {font-size:17px}

p {line-height:1.5}

.muted {color:var(--gray);font-size:13px}

.green {color:var(--green)}

.card {

  background:var(--panel);

  border:1px solid var(--border);

  border-radius:14px;

  padding:17px;

  margin:14px 0;

}

.grid {

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:10px;

}

.stat {

  background:var(--panel2);

  border-radius:12px;

  padding:15px;

}

.stat strong {font-size:25px;display:block;margin-top:8px}

button {

  border:0;

  border-radius:9px;

  padding:13px 15px;

  font-weight:bold;

  cursor:pointer;

  font-size:14px;

}

.primary {background:var(--green);color:#10120f}

.secondary {background:var(--panel2);color:white;border:1px solid var(--border)}

.danger {background:#422323;color:#ff8585}

.small {padding:9px 11px;font-size:12px}

.full {width:100%;margin-top:10px}

input,select,textarea {

  width:100%;

  background:#11140f;

  color:white;

  border:1px solid var(--border);

  padding:12px;

  border-radius:8px;

  margin:6px 0 13px;

  font-size:14px;

}

label {font-size:13px;color:#c4c9bd}

textarea {min-height:75px;resize:vertical}

.row {

  display:flex;

  gap:9px;

  align-items:center;

  flex-wrap:wrap;

}

.row > * {flex:1}

.exercise {

  background:var(--panel2);

  border:1px solid var(--border);

  padding:14px;

  border-radius:11px;

  margin:10px 0;

}

.exercise strong {font-size:15px}

.pill {

  display:inline-block;

  background:#303b24;

  color:var(--green);

  padding:5px 9px;

  border-radius:20px;

  font-size:11px;

  margin:3px 3px 3px 0;

}

nav {

  position:fixed;

  bottom:0;

  left:0;

  right:0;

  background:#191c17;

  border-top:1px solid var(--border);

  display:flex;

  justify-content:space-around;

  padding:10px 3px calc(10px + env(safe-area-inset-bottom));

  z-index:10;

}

nav button {

  background:none;

  color:var(--gray);

  padding:7px 5px;

  font-size:11px;

  flex:1;

}

nav button.active {color:var(--green)}

nav span {display:block;font-size:19px;margin-bottom:4px}

.section-title {margin-top:25px}

.empty {text-align:center;padding:30px 15px;color:var(--gray)}

.hidden {display:none!important}

.actions {display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}

.actions button {flex:1}

hr {border:0;border-top:1px solid var(--border);margin:18px 0}

</style>

</head>

<body>

<header>

  <div class="logo">TP<span>.</span> TRAINING PLANNER</div>

  <div class="muted">TU ESPACIO DE ENTRENAMIENTO</div>

</header>

<main id="app"></main>

<nav>

  <button class="active" data-tab="inicio"><span>⌂</span>Inicio</button>

  <button data-tab="rutinas"><span>▤</span>Rutinas</button>

  <button data-tab="ejercicios"><span>◎</span>Ejercicios</button>

  <button data-tab="analisis"><span>▥</span>Análisis</button>

</nav>

<script>

const STORAGE_KEY = "tp_training_planner_v1";

let data = loadData();

let tab = "inicio";

let selectedPlan = null;

let selectedDay = null;

let searchText = "";

function loadData() {

  try {

    const saved = localStorage.getItem(STORAGE_KEY);

    return saved ? JSON.parse(saved) : {plans:[], logs:[]};

  } catch(e) {

    return {plans:[],logs:[]};

  }

}

function saveData() {

  try {

    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

    const status = document.getElementById("saveStatus");

    if(status) status.textContent = "Guardado automáticamente ✓";

  } catch(e) {

    alert("No se pudieron guardar los datos. Revisá el espacio disponible del navegador.");

  }

}

const library = [

  ["Sentadilla","Cuádriceps"],

  ["Sentadilla frontal","Cuádriceps"],

  ["Prensa","Cuádriceps"],

  ["Extensión de cuádriceps","Cuádriceps"],

  ["Zancadas","Cuádriceps"],

  ["Peso muerto rumano","Isquiotibiales"],

  ["Curl femoral","Isquiotibiales"],

  ["Hip thrust","Glúteos"],

  ["Patada de glúteo","Glúteos"],

  ["Abducción de cadera","Glúteos"],

  ["Elevación de gemelos","Gemelos"],

  ["Press banca","Pecho"],

  ["Press inclinado","Pecho"],

  ["Aperturas","Pecho"],

  ["Dominadas","Espalda"],

  ["Jalón al pecho","Espalda"],

  ["Remo con barra","Espalda"],

  ["Remo con mancuerna","Espalda"],

  ["Press militar","Hombros"],

  ["Elevaciones laterales","Hombros"],

  ["Pájaros","Hombros"],

  ["Curl de bíceps","Bíceps"],

  ["Curl martillo","Bíceps"],

  ["Extensión de tríceps","Tríceps"],

  ["Fondos","Tríceps"],

  ["Plancha","Core"],

  ["Plancha lateral","Core"],

  ["Crunch abdominal","Core"],

  ["Pallof press","Core"],

  ["Trote","Cardio"],

  ["Bicicleta","Cardio"],

  ["Saltos al cajón","Potencia"],

  ["Salto vertical","Potencia"],

  ["Sprint","Potencia"]

];

function id() {

  return Date.now().toString(36)+Math.random().toString(36).slice(2,7);

}

function safe(value) {

  return String(value ?? "").replace(/[&<>"']/g, c => ({

    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"

  })[c]);

}

function go(next) {

  tab = next;

  selectedPlan = null;

  selectedDay = null;

  render();

}

function render() {

  document.querySelectorAll("nav button").forEach(b =>

    b.classList.toggle("active",b.dataset.tab===tab)

  );

  const app = document.getElementById("app");

  if(tab==="inicio") app.innerHTML = homeView();

  if(tab==="rutinas") app.innerHTML = routinesView();

  if(tab==="ejercicios") app.innerHTML = exercisesView();

  if(tab==="analisis") app.innerHTML = analysisView();

  if(selectedPlan) app.innerHTML = planView();

  if(selectedPlan && selectedDay) app.innerHTML = dayView();

}

function homeView() {

  const total = data.plans.length;

  const exercises = data.plans.reduce((n,p)=>

    n+p.days.reduce((m,d)=>m+d.exercises.length,0),0);

  return `

    <p class="muted">TU ESPACIO DE ENTRENAMIENTO</p>

    <h1>Planificá. Entrená.<br><span class="green">Evolucioná.</span></h1>

    <div class="grid">

      <div class="stat"><span class="muted">Planificaciones</span><strong>${total}</strong></div>

      <div class="stat"><span class="muted">Ejercicios agregados</span><strong>${exercises}</strong></div>

    </div>

    <div class="card">

      <h3>Mis entrenamientos</h3>

      <p class="muted">Organizá tus rutinas y seguí tu planificación.</p>

      <button class="primary full" onclick="createPlan()">+ CREAR PLANIFICACIÓN</button>

    </div>

    <div class="row section-title">

      <h2>Mis planes</h2>

      <button class="secondary small" onclick="go('rutinas')">Ver todos</button>

    </div>

    ${data.plans.length ? data.plans.slice(0,3).map(planCard).join("") :

      `<div class="card empty">Todavía no tenés planificaciones.<br>Creá tu primer plan para comenzar.</div>`}

    <p id="saveStatus" class="muted">Guardado automáticamente ✓</p>

  `;

}

function planCard(p) {

  return `

    <div class="card">

      <h3>${safe(p.name)}</h3>

      <span class="pill">${safe(p.goal)}</span>

      <span class="pill">${p.frequency} días/semana</span>

      <p class="muted">${p.days.length} días de entrenamiento</p>

      <button class="primary full" onclick="openPlan('${p.id}')">ABRIR PLANIFICACIÓN</button>

    </div>

  `;

}

function routinesView() {

  return `

    <h1>Mis rutinas</h1>

    <p class="muted">Creá y organizá tus planificaciones.</p>

    <button class="primary full" onclick="createPlan()">+ NUEVA PLANIFICACIÓN</button>

    ${data.plans.length ? data.plans.map(planCard).join("") :

      `<div class="card empty">Todavía no creaste ninguna rutina.</div>`}

  `;

}

function createPlan() {

  const name = prompt("Nombre de la planificación:");

  if(!name || !name.trim()) return;

  const goal = prompt("Objetivo: Hipertrofia, Fuerza, Resistencia o Rendimiento","Hipertrofia");

  if(!goal) return;

  const frequency = Number(prompt("¿Cuántos días por semana? (2 a 6)","4"));

  if(!Number.isInteger(frequency) || frequency<2 || frequency>6) {

    alert("Elegí una frecuencia entre 2 y 6 días.");

    return;

  }

  const days = Array.from({length:frequency},(_,i)=>({

    id:id(),

    name:"Día "+(i+1),

    exercises:[]

  }));

  data.plans.push({

    id:id(),

    name:name.trim(),

    goal:goal.trim(),

    frequency,

    days,

    created:new Date().toISOString()

  });

  saveData();

  selectedPlan = data.plans[data.plans.length-1].id;

  render();

}

function getPlan() {

  return data.plans.find(p=>p.id===selectedPlan);

}

function openPlan(planId) {

  selectedPlan = planId;

  selectedDay = null;

  render();

}

function planView() {

  const p = getPlan();

  if(!p) {selectedPlan=null;return routinesView();}

  return `

    <button class="secondary small" onclick="go('rutinas')">← Volver a rutinas</button>

    <h1>${safe(p.name)}</h1>

    <span class="pill">${safe(p.goal)}</span>

    <span class="pill">${p.frequency} días/semana</span>

    <div class="card">

      <label>Nombre de la planificación</label>

      <input id="editPlanName" value="${safe(p.name)}">

      <label>Objetivo</label>

      <select id="editPlanGoal">

        ${["Hipertrofia","Fuerza","Resistencia","Rendimiento"].map(g=>

          `<option ${p.goal===g?"selected":""}>${g}</option>`).join("")}

      </select>

      <button class="primary full" onclick="editPlan()">GUARDAR CAMBIOS</button>

    </div>

    <h2>Días de entrenamiento</h2>

    ${p.days.map(d=>`

      <div class="card">

        <div class="row">

          <div>

            <h3>${safe(d.name)}</h3>

            <p class="muted">${d.exercises.length} ejercicios</p>

          </div>

          <button class="primary small" onclick="openDay('${d.id}')">ABRIR</button>

        </div>

        <button class="secondary small full" onclick="renameDay('${d.id}')">Cambiar nombre del día</button>

      </div>

    `).join("")}

    <button class="secondary full" onclick="addDay()">+ AGREGAR DÍA</button>

    <button class="danger full" onclick="deletePlan('${p.id}')">ELIMINAR PLANIFICACIÓN</button>

  `;

}

function editPlan() {

  const p=getPlan();

  p.name=document.getElementById("editPlanName").value.trim() || p.name;

  p.goal=document.getElementById("editPlanGoal").value;

  saveData();render();

}

function renameDay(dayId) {

  const p=getPlan();

  const d=p.days.find(x=>x.id===dayId);

  const name=prompt("Nuevo nombre del día:",d.name);

  if(name && name.trim()) {d.name=name.trim();saveData();render();}

}

function addDay() {

  const p=getPlan();

  if(p.days.length>=7) return alert("Máximo 7 días.");

  p.days.push({id:id(),name:"Día "+(p.days.length+1),exercises:[]});

  p.frequency=p.days.length;

  saveData();render();

}

function deletePlan(planId) {

  if(!confirm("¿Seguro que querés eliminar esta planificación?")) return;

  data.plans=data.plans.filter(p=>p.id!==planId);

  selectedPlan=null;

  saveData();render();

}

function openDay(dayId) {

  selectedDay=dayId;

  render();

}

function getDay() {

  return getPlan()?.days.find(d=>d.id===selectedDay);

}

function dayView() {

  const p=getPlan(),d=getDay();

  if(!p || !d) return planView();

  return `

    <button class="secondary small" onclick="selectedDay=null;render()">← Volver a ${safe(p.name)}</button>

    <h1>${safe(d.name)}</h1>

    <p class="muted">${safe(p.name)}</p>

    <button class="primary full" onclick="addExercise()">+ AGREGAR EJERCICIO</button>

    ${d.exercises.length ? d.exercises.map((e,i)=>`

      <div class="exercise">

        <strong>${i+1}. ${safe(e.name)}</strong>

        <p class="muted">${safe(e.muscle)}</p>

        <span class="pill">${e.sets} series</span>

        <span class="pill">${safe(e.reps)} reps</span>

        <span class="pill">${safe(e.weight)} kg</span>

        <span class="pill">RIR ${safe(e.rir)}</span>

        <span class="pill">${safe(e.tempo)} tempo</span>

        <span class="pill">${safe(e.rest)} descanso</span>

        <p class="muted">Técnica: ${safe(e.type)}</p>

        ${e.notes?`<p class="muted">${safe(e.notes)}</p>`:""}

        <div class="actions">

          <button class="secondary small" onclick="editExercise('${e.id}')">EDITAR</button>

          <button class="danger small" onclick="deleteExercise('${e.id}')">ELIMINAR</button>

        </div>

      </div>

    `).join("") : `<div class="card empty">Todavía no agregaste ejercicios a este día.</div>`}

  `;

}

function addExercise() {

  const name=prompt("Nombre del ejercicio:");

  if(!name || !name.trim()) return;

  const muscle=prompt("Grupo muscular:");

  if(!muscle) return;

  const exercise={

    id:id(),

    name:name.trim(),

    muscle:muscle.trim(),

    sets:3,

    reps:"10",

    weight:"0",

    rir:"2",

    tempo:"2-0-2",

    rest:"90 seg",

    type:"Normal",

    notes:""

  };

  getDay().exercises.push(exercise);

  saveData();render();

  editExercise(exercise.id);

}

function editExercise(exerciseId) {

  const e=getDay().exercises.find(x=>x.id===exerciseId);

  if(!e) return;

  const sets=prompt("Cantidad de series:",e.sets);

  if(sets===null) return;

  const reps=prompt("Repeticiones:",e.reps);

  if(reps===null) return;

  const weight=prompt("Peso en kg:",e.weight);

  if(weight===null) return;

  const rir=prompt("RIR (repeticiones en reserva):",e.rir);

  if(rir===null) return;

  const tempo=prompt("Tempo (ejemplo: 2-0-2):",e.tempo);

  if(tempo===null) return;

  const rest=prompt("Descanso:",e.rest);

  if(rest===null) return;

  const type=prompt("Tipo: Normal, Superserie, Drop set o Rest-pause",e.type);

  if(type===null) return;

  const notes=prompt("Notas técnicas:",e.notes);

  if(notes===null) return;

  e.sets=Math.max(1,Number(sets)||1);

  e.reps=reps;

  e.weight=weight;

  e.rir=rir;

  e.tempo=tempo;

  e.rest=rest;

  e.type=type;

  e.notes=notes;

  saveData();render();

}

function deleteExercise(exerciseId) {

  if(!confirm("¿Eliminar este ejercicio?")) return;

  const d=getDay();

  d.exercises=d.exercises.filter(e=>e.id!==exerciseId);

  saveData();render();

}

function exercisesView() {

  const muscles=["Todos",...new Set(library.map(x=>x[1]))];

  const filtered=library.filter(x=>

    (searchText==="" || x[0].toLowerCase().includes(searchText.toLowerCase())) &&

    (window.muscleFilter==="Todos" || !window.muscleFilter || x[1]===window.muscleFilter)

  );

  return `

    <h1>Ejercicios</h1>

    <p class="muted">Biblioteca de ejercicios por grupo muscular.</p>

    <input placeholder="Buscar ejercicio..." value="${safe(searchText)}"

      oninput="searchText=this.value;render()">

    <select onchange="window.muscleFilter=this.value;render()">

      ${muscles.map(m=>`<option ${window.muscleFilter===m?"selected":""}>${m}</option>`).join("")}

    </select>

    ${filtered.map(x=>`

      <div class="exercise">

        <strong>${safe(x[0])}</strong>

        <p class="muted">${safe(x[1])}</p>

      </div>

    `).join("")}

  `;

}

function analysisView() {

  const totalPlans=data.plans.length;

  const totalExercises=data.plans.reduce((n,p)=>

    n+p.days.reduce((m,d)=>m+d.exercises.length,0),0);

  const groups={};

  data.plans.forEach(p=>p.days.forEach(d=>d.exercises.forEach(e=>{

    groups[e.muscle]=(groups[e.muscle]||0)+1;

  })));

  return `

    <h1>Análisis</h1>

    <p class="muted">Resumen de tus planificaciones actuales.</p>

    <div class="grid">

      <div class="stat"><span class="muted">Planes creados</span><strong>${totalPlans}</strong></div>

      <div class="stat"><span class="muted">Ejercicios</span><strong>${totalExercises}</strong></div>

    </div>

    <div class="card">

      <h3>Ejercicios por grupo muscular</h3>

      ${Object.keys(groups).length ?

        Object.entries(groups).map(([name,n])=>`

          <p>${safe(name)} <strong class="green">${n}</strong></p>

        `).join("") :

        `<p class="muted">Agregá ejercicios a tus rutinas para ver el análisis.</p>`}

    </div>

    <div class="card">

      <h3>Guardado de datos</h3>

      <p class="muted">Tus planificaciones se guardan automáticamente en el almacenamiento local de este navegador.</p>

      <span class="green">Guardado automático activado ✓</span>

    </div>

  `;

}

document.querySelectorAll("nav button").forEach(button=>{

  button.addEventListener("click",()=>go(button.dataset.tab));

});

render();

</script>

</body>

</html>
