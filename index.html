<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#101411">

<title>TP Training Planner</title>

<style>

:root{

 --bg:#101411;--panel:#191f1b;--panel2:#202923;--line:#303b33;

 --green:#b5f36b;--green2:#8acb43;--text:#f2f5f1;--muted:#9ba79d;

 --red:#ff7777;--yellow:#f5ca67;--blue:#83baff;

}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;font-size:14px}

button,input,select,textarea{font:inherit}

button{cursor:pointer}

.app{max-width:1100px;margin:auto;padding:18px}

header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}

.logo{font-size:20px;font-weight:900;letter-spacing:1px}

.logo span{color:var(--green)}

.subtitle{color:var(--muted);font-size:12px;margin-top:4px}

.nav{display:flex;gap:7px;overflow-x:auto;padding:5px 0 14px;margin-bottom:15px}

.nav button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 13px;border-radius:10px}

.nav button.active{background:var(--green);color:#101411;border-color:var(--green);font-weight:800}

h1{font-size:24px;margin:5px 0 18px}

h2{font-size:18px;margin:0 0 13px}

h3{font-size:15px;margin:0 0 10px}

p{line-height:1.5}

.muted{color:var(--muted)}

.small{font-size:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:13px}

.card.soft{background:var(--panel2)}

.stat{font-size:27px;font-weight:900;color:var(--green);margin-top:7px}

.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.stack{display:grid;gap:10px}

label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}

input,select,textarea{width:100%;background:#111713;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;outline:none}

input:focus,select:focus,textarea:focus{border-color:var(--green)}

textarea{min-height:75px;resize:vertical}

.field{min-width:130px;flex:1}

.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:#111710;font-weight:800}

.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}

.btn.danger{background:#512727;color:#ffb1b1}

.btn.smallbtn{padding:7px 10px;font-size:12px}

.btn:disabled{opacity:.45;cursor:not-allowed}

.tag{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:4px 8px;color:var(--muted);font-size:11px}

.tag.green{color:var(--green);border-color:#55783c}

hr{border:0;border-top:1px solid var(--line);margin:15px 0}

.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.item{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin:8px 0}

.item-title{font-weight:800;margin-bottom:5px}

.table-wrap{overflow-x:auto}

table{border-collapse:collapse;width:100%;min-width:450px}

th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:12px}

th{color:var(--muted);font-weight:700}

.hidden{display:none!important}

.notice{background:#263222;border:1px solid #55783c;color:#d8f4c0;padding:11px;border-radius:10px;margin:10px 0}

.warning{background:#392f1d;border:1px solid #715b2e;color:#f5d995;padding:11px;border-radius:10px;margin:10px 0}

.danger-text{color:var(--red)}

.green-text{color:var(--green)}

.progress-track{height:8px;background:#303b33;border-radius:10px;overflow:hidden}

.progress-fill{height:100%;background:var(--green);border-radius:10px}

.chart-box{width:100%;overflow:hidden}

.chart-box svg{width:100%;height:auto;display:block}

footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 0}

@media(max-width:600px){

 .app{padding:12px}

 h1{font-size:21px}

 .card{padding:13px}

 header{align-items:flex-start}

 .logo{font-size:17px}

 .nav button{padding:9px 11px;font-size:12px}

}

</style>

</head>

<body>

<div class="app">

<header>

 <div>

  <div class="logo">TP <span>TRAINING</span> PLANNER</div>

  <div class="subtitle">Planificación · Seguimiento · Progreso</div>

 </div>

 <span class="tag green">PRO</span>

</header>

<nav class="nav" id="nav">

 <button data-page="inicio" class="active">Inicio</button>

 <button data-page="planes">Planificaciones</button>

 <button data-page="clientes">Clientes</button>

 <button data-page="ejercicios">Ejercicios</button>

 <button data-page="estadisticas">Estadísticas</button>

 <button data-page="herramientas">Herramientas</button>

 <button data-page="datos">Datos</button>

</nav>

<main id="root"></main>

<footer>TP TRAINING PLANNER · Tu espacio de planificación</footer>

</div>

<script>

"use strict";

/* ==========================================

   1. ALMACENAMIENTO Y VARIABLES PRINCIPALES

========================================== */

const KEYS={

 plans:"tp_training_planner_v1",

 exercises:"tp_custom_exercises_v1",

 clients:"tp_clients_v1"

};

function read(key,fallback){

 try{

  const value=localStorage.getItem(key);

  return value?JSON.parse(value):fallback;

 }catch(error){

  console.error("Error leyendo almacenamiento:",error);

  return fallback;

 }

}

function save(key,value){

 try{

  localStorage.setItem(key,JSON.stringify(value));

  return true;

 }catch(error){

  alert("No se pudieron guardar los datos. Revisá el espacio disponible del navegador.");

  return false;

 }

}

let plans=read(KEYS.plans,[]);

let customExercises=read(KEYS.exercises,[]);

let clients=read(KEYS.clients,[]);

let page="inicio";

let selectedPlan=null;

let selectedClient=null;

let editingSession=null;

let timerInterval=null;

let timerSeconds=0;

const root=document.getElementById("root");

function uid(){

 return Date.now().toString(36)+Math.random().toString(36).slice(2,8);

}

function esc(value){

 return String(value??"").replace(/[&<>"']/g,char=>({

  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"

 }[char]));

}

function today(){

 const d=new Date();

 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

}

function formatDate(value){

 if(!value)return "Sin fecha";

 const parts=String(value).split("-");

 return parts.length===3?parts[2]+"/"+parts[1]+"/"+parts[0]:value;

}

function number(value){

 const n=Number(value);

 return Number.isFinite(n)?n:0;

}

function persistAll(){

 save(KEYS.plans,plans);

 save(KEYS.exercises,customExercises);

 save(KEYS.clients,clients);

}

function normalizeName(value){

 return String(value||"").trim().toLocaleLowerCase("es");

}

function effectiveSets(exercise){

 return (exercise?.series||[]).filter(set=>set.type==="Efectiva");

}

function totalEffectiveSets(session){

 return (session?.exercises||[]).reduce((total,exercise)=>{

  return total+effectiveSets(exercise).length;

 },0);

}

function getClient(id){

 return clients.find(client=>client.id===id);

}

function getPlan(id){

 return plans.find(plan=>plan.id===id);

}

function allExercises(){

 return [...customExercises];

}

function navigate(next){

 page=next;

 selectedPlan=null;

 selectedClient=null;

 editingSession=null;

 render();

}

document.getElementById("nav").addEventListener("click",event=>{

 const button=event.target.closest("[data-page]");

 if(!button)return;

 navigate(button.dataset.page);

});

function setActiveNav(){

 document.querySelectorAll("#nav button").forEach(button=>{

  button.classList.toggle("active",button.dataset.page===page);

 });

}

/* ==========================================

   2. FUNCIONES GENERALES DE INTERFAZ

========================================== */

function pageTitle(title,description=""){

 return `<div class="between">

  <div><h1>${esc(title)}</h1>

  ${description?`<div class="muted">${esc(description)}</div>`:""}</div>

 </div>`;

}

function emptyState(message){

 return `<div class="empty">${esc(message)}</div>`;

}

function button(label,action,kind=""){

 return `<button class="btn ${kind}" data-action="${esc(action)}">${esc(label)}</button>`;

}

function field(label,name,value="",type="text",placeholder=""){

 return `<div class="field">

  <label>${esc(label)}</label>

  <input name="${esc(name)}" type="${esc(type)}" value="${esc(value)}" placeholder="${esc(placeholder)}">

 </div>`;

}

function selectField(label,name,options,value=""){

 return `<div class="field"><label>${esc(label)}</label>

 <select name="${esc(name)}">

 ${options.map(option=>`<option value="${esc(option)}" ${option===value?"selected":""}>${esc(option)}</option>`).join("")}

 </select></div>`;

}

function card(title,content,extra=""){

 return `<section class="card">

  <div class="between"><h2>${esc(title)}</h2>${extra}</div>

  ${content}

 </section>`;

}

function confirmDelete(message){

 return window.confirm(message||"¿Seguro que querés eliminar este elemento?");

}

function downloadFile(filename,content,type="application/json"){

 const blob=new Blob([content],{type});

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;

 a.download=filename;

 a.click();

 URL.revokeObjectURL(url);

}

/* ==========================================

   3. INICIO DE LA APLICACIÓN

   Las pantallas y funciones continúan

   en las siguientes partes.

========================================== *//* ==========================================

   3. INICIO Y NAVEGACIÓN DE LA APLICACIÓN

========================================== */

function render(){

 setActiveNav();

 const pages={

  inicio:homePage,

  planes:plansPage,

  clientes:clientsPage,

  ejercicios:exercisesPage,

  estadisticas:statsPage,

  herramientas:toolsPage,

  datos:dataPage

 };

 root.innerHTML=(pages[page]||homePage)();

}

function homePage(){

 const totalSessions=clients.reduce((n,c)=>n+(c.sessions||[]).length,0);

 const totalPlans=plans.length;

 const totalSets=clients.reduce((n,c)=>{

  return n+(c.sessions||[]).reduce((s,session)=>s+totalEffectiveSets(session),0);

 },0);

 return `

 ${pageTitle("Inicio","Panel general de TP Training Planner")}

 <div class="grid">

  <div class="card">

   <div class="muted">Clientes registrados</div>

   <div class="stat">${clients.length}</div>

  </div>

  <div class="card">

   <div class="muted">Planificaciones</div>

   <div class="stat">${totalPlans}</div>

  </div>

  <div class="card">

   <div class="muted">Entrenamientos registrados</div>

   <div class="stat">${totalSessions}</div>

  </div>

  <div class="card">

   <div class="muted">Series efectivas registradas</div>

   <div class="stat">${totalSets}</div>

  </div>

 </div>

 ${card("Accesos rápidos",`

  <div class="grid">

   <button class="btn" data-action="go-clients">Ver clientes</button>

   <button class="btn secondary" data-action="go-plans">Crear planificación</button>

   <button class="btn secondary" data-action="go-exercises">Biblioteca de ejercicios</button>

   <button class="btn secondary" data-action="go-stats">Ver estadísticas</button>

  </div>

 `)}

 ${card("Últimos entrenamientos",recentSessionsHTML())}

 ${card("Clientes",clients.length?clients.slice(0,5).map(c=>`

  <div class="item between">

   <div>

    <div class="item-title">${esc(c.name||"Sin nombre")}</div>

    <div class="small muted">${(c.sessions||[]).length} entrenamientos registrados</div>

   </div>

   <button class="btn secondary smallbtn" data-action="open-client" data-id="${esc(c.id)}">Abrir</button>

  </div>

 `).join(""):emptyState("Todavía no agregaste clientes.")}

 `)}

 `;

}

function recentSessionsHTML(){

 const sessions=[];

 clients.forEach(c=>{

  (c.sessions||[]).forEach(s=>sessions.push({...s,clientName:c.name,clientId:c.id}));

 });

 sessions.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));

 if(!sessions.length)return emptyState("Todavía no hay entrenamientos registrados.");

 return sessions.slice(0,5).map(s=>`

  <div class="item between">

   <div>

    <div class="item-title">${esc(s.clientName||"Cliente")} · ${esc(s.dayName||"Entrenamiento")}</div>

    <div class="small muted">${formatDate(s.date)} · ${s.exercises?.length||0} ejercicios</div>

   </div>

   <button class="btn secondary smallbtn" data-action="open-session" data-client="${esc(s.clientId)}" data-id="${esc(s.id)}">Ver</button>

  </div>

 `).join("");

}

/* ==========================================

   4. PLANIFICACIONES

========================================== */

function plansPage(){

 if(selectedPlan){

  const plan=getPlan(selectedPlan);

  if(plan)return planEditorPage(plan);

  selectedPlan=null;

 }

 return `

 ${pageTitle("Planificaciones","Creá y organizá tus rutinas de entrenamiento.")}

 <div class="row" style="margin-bottom:14px">

  <button class="btn" data-action="new-plan">+ Nueva planificación</button>

 </div>

 ${plans.length?plans.map(p=>`

  <div class="card">

   <div class="between">

    <div>

     <h2>${esc(p.name||"Plan sin nombre")}</h2>

     <div class="muted small">${(p.days||[]).length} días de entrenamiento</div>

     ${p.description?`<p class="small">${esc(p.description)}</p>`:""}

    </div>

    <div class="row">

     <button class="btn secondary smallbtn" data-action="edit-plan" data-id="${esc(p.id)}">Editar</button>

     <button class="btn danger smallbtn" data-action="delete-plan" data-id="${esc(p.id)}">Eliminar</button>

    </div>

   </div>

   ${(p.days||[]).map((d,i)=>`

    <div class="item">

     <div class="item-title">Día ${i+1}: ${esc(d.name||"Sin nombre")}</div>

     <div class="small muted">${(d.exercises||[]).length} ejercicios</div>

    </div>

   `).join("")}

  </div>

 `).join(""):emptyState("Todavía no creaste planificaciones.")}

 `;

}

function planEditorPage(plan){

 return `

 ${pageTitle(plan.id?"Editar planificación":"Nueva planificación")}

 <div class="card">

  <div class="stack">

   <div>

    <label>Nombre de la planificación</label>

    <input id="plan-name" value="${esc(plan.name||"")}" placeholder="Ej. Fuerza e hipertrofia">

   </div>

   <div>

    <label>Descripción</label>

    <textarea id="plan-description" placeholder="Objetivo y características">${esc(plan.description||"")}</textarea>

   </div>

  </div>

  <hr>

  <div class="between">

   <h2>Días de entrenamiento</h2>

   <button class="btn smallbtn" data-action="add-day" data-id="${esc(plan.id)}">+ Agregar día</button>

  </div>

  ${(plan.days||[]).map((day,index)=>`

   <div class="item">

    <div class="between">

     <strong>Día ${index+1}</strong>

     <button class="btn danger smallbtn" data-action="delete-day" data-plan="${esc(plan.id)}" data-index="${index}">Eliminar día</button>

    </div>

    <label>Nombre del día</label>

    <input class="day-name" data-index="${index}" value="${esc(day.name||"")}" placeholder="Ej. Tren inferior">

    <div class="between" style="margin-top:12px">

     <span class="small muted">${(day.exercises||[]).length} ejercicios</span>

     <button class="btn secondary smallbtn" data-action="add-plan-exercise" data-plan="${esc(plan.id)}" data-index="${index}">+ Agregar ejercicio</button>

    </div>

    ${(day.exercises||[]).map((ex,j)=>`

     <div class="item">

      <div class="between">

       <div>

        <strong>${esc(ex.name||"Ejercicio")}</strong>

        <div class="small muted">${esc(ex.muscle||"Sin grupo muscular")}</div>

       </div>

       <button class="btn danger smallbtn" data-action="remove-plan-exercise" data-plan="${esc(plan.id)}" data-day="${index}" data-index="${j}">Quitar</button>

      </div>

      <div class="grid">

       <div class="field"><label>Series</label><input type="number" min="1" class="plan-ex-series" data-day="${index}" data-index="${j}" value="${number(ex.sets)||3}"></div>

       <div class="field"><label>Repeticiones</label><input class="plan-ex-reps" data-day="${index}" data-index="${j}" value="${esc(ex.reps||"8-12")}"></div>

       <div class="field"><label>Descanso (seg.)</label><input type="number" min="0" class="plan-ex-rest" data-day="${index}" data-index="${j}" value="${number(ex.rest)||90}"></div>

       <div class="field"><label>RIR objetivo</label><input type="number" min="0" max="5" class="plan-ex-rir" data-day="${index}" data-index="${j}" value="${ex.rir??2}"></div>

      </div>

     </div>

    `).join("")}

   </div>

  `).join("")}

  <div class="row">

   <button class="btn" data-action="save-plan" data-id="${esc(plan.id)}">Guardar planificación</button>

   <button class="btn secondary" data-action="cancel-plan">Volver</button>

  </div>

 </div>

 `;

}

/* ==========================================

   5. CLIENTES

========================================== */

function clientsPage(){

 if(selectedClient){

  const client=getClient(selectedClient);

  if(client)return clientProfilePage(client);

  selectedClient=null;

 }

 return `

 ${pageTitle("Clientes","Administrá sus planificaciones y evolución.")}

 <div class="row" style="margin-bottom:14px">

  <button class="btn" data-action="new-client">+ Agregar cliente</button>

 </div>

 ${clients.length?clients.map(c=>`

  <div class="card">

   <div class="between">

    <div>

     <h2>${esc(c.name||"Sin nombre")}</h2>

     <div class="small muted">${esc(c.goal||"Sin objetivo definido")}</div>

     <div class="small muted">${(c.sessions||[]).length} entrenamientos · ${(c.evaluations||[]).length} evaluaciones</div>

    </div>

    <div class="row">

     <button class="btn smallbtn" data-action="open-client" data-id="${esc(c.id)}">Abrir perfil</button>

     <button class="btn danger smallbtn" data-action="delete-client" data-id="${esc(c.id)}">Eliminar</button>

    </div>

   </div>

  </div>

 `).join(""):emptyState("Todavía no agregaste clientes.")}

 `;

}

function clientProfilePage(c){

 const assignedPlan=c.trainingPlan;

 const sessions=(c.sessions||[]).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));

 const evaluations=(c.evaluations||[]).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));

 return `

 ${pageTitle(c.name||"Cliente","Perfil y seguimiento individual")}

 <div class="row" style="margin-bottom:12px">

  <button class="btn secondary" data-action="back-clients">← Volver a clientes</button>

  <button class="btn secondary" data-action="edit-client" data-id="${esc(c.id)}">Editar datos</button>

 </div>

 <div class="grid">

  <div class="card">

   <div class="muted small">Objetivo</div>

   <h2>${esc(c.goal||"Sin definir")}</h2>

  </div>

  <div class="card">

   <div class="muted small">Entrenamientos</div>

   <div class="stat">${sessions.length}</div>

  </div>

  <div class="card">

   <div class="muted small">Evaluaciones</div>

   <div class="stat">${evaluations.length}</div>

  </div>

 </div>

 ${card("Datos del cliente",`

  <div class="grid">

   <div><span class="muted small">Edad</span><div>${esc(c.age||"No registrada")}</div></div>

   <div><span class="muted small">Actividad</span><div>${esc(c.activity||"No registrada")}</div></div>

   <div><span class="muted small">Observaciones</span><div>${esc(c.notes||"Sin observaciones")}</div></div>

  </div>

 `)}

 ${card("Planificación individual",`

  <div class="muted small">Esta planificación pertenece a este cliente y puede modificarse sin alterar la planificación general.</div>

  ${assignedPlan?`

   <div class="item">

    <strong>${esc(assignedPlan.name||"Plan individual")}</strong>

    <div class="small muted">${(assignedPlan.days||[]).length} días</div>

   </div>

   <button class="btn" data-action="edit-client-plan" data-id="${esc(c.id)}">Editar rutina del cliente</button>

  `:`

   <p class="muted">Todavía no tiene una planificación asignada.</p>

   <button class="btn" data-action="assign-plan" data-id="${esc(c.id)}">Asignar planificación</button>

  `}

 `)}

 ${card("Registrar entrenamiento",`

  <p class="muted small">Elegí un día de su planificación para registrar los ejercicios y las series realizadas.</p>

  <button class="btn" data-action="new-session" data-id="${esc(c.id)}" ${assignedPlan?"":"disabled"}>+ Nuevo entrenamiento</button>

 `)}

 ${card("Evaluaciones",`

  <div class="grid">

   <div class="field"><label>Fecha</label><input id="evaluation-date" type="date" value="${today()}"></div>

   <div class="field"><label>Peso corporal (kg)</label><input id="evaluation-weight" type="number" min="0" step="0.1" placeholder="Ej. 70.5"></div>

  </div>

  <div style="margin-top:10px">

   <label>Observaciones</label>

   <textarea id="evaluation-note" placeholder="Anotaciones de la evaluación"></textarea>

  </div>

  <button class="btn" style="margin-top:10px" data-action="save-evaluation" data-id="${esc(c.id)}">Guardar evaluación</button>

  <hr>

  ${evaluations.length?evaluations.map(e=>`

   <div class="item between">

    <div>

     <strong>${formatDate(e.date)}</strong>

     <div class="small muted">${e.weight!==undefined&&e.weight!==""?esc(e.weight)+" kg":""} ${esc(e.note||"")}</div>

    </div>

    <button class="btn danger smallbtn" data-action="delete-evaluation" data-client="${esc(c.id)}" data-id="${esc(e.id)}">Eliminar</button>

   </div>

  `).join(""):emptyState("Todavía no hay evaluaciones.")}

 `)}

 ${card("Historial de entrenamientos",`

  ${sessions.length?sessions.map(s=>`

   <div class="item between">

    <div>

     <strong>${formatDate(s.date)} · ${esc(s.dayName||"Entrenamiento")}</strong>

     <div class="small muted">${s.exercises?.length||0} ejercicios · ${totalEffectiveSets(s)} series efectivas</div>

    </div>

    <div class="row">

     <button class="btn secondary smallbtn" data-action="open-session" data-client="${esc(c.id)}" data-id="${esc(s.id)}">Ver</button>

function statsPage(){

 const muscleTotals={};

 let totalSessions=0;

 let totalEffective=0;

 clients.forEach(c=>{

  (c.sessions||[]).forEach(s=>{

   totalSessions++;

   (s.exercises||[]).forEach(ex=>{

    const muscle=ex.muscle||"Otros";

    muscleTotals[muscle]=(muscleTotals[muscle]||0)+effectiveSets(ex).length;

    totalEffective+=effectiveSets(ex).length;

   });

  });

 });

 const muscles=Object.entries(muscleTotals).sort((a,b)=>b[1]-a[1]);

 return `

 <div class="grid">

  <div class="card"><div class="muted">Clientes</div><div class="stat">${clients.length}</div></div>

  <div class="card"><div class="muted">Entrenamientos</div><div class="stat">${totalSessions}</div></div>

  <div class="card"><div class="muted">Series efectivas</div><div class="stat">${totalEffective}</div></div>

 </div>

 ${card("Series efectivas por grupo muscular",muscles.length?muscles.map(([muscle,total])=>`

  <div class="item">

   <div class="between"><strong>${esc(muscle)}</strong><strong>${total}</strong></div>

   <div class="progress-track" style="margin-top:8px">

    <div class="progress-fill" style="width:${Math.max(2,total/Math.max(...muscles.map(x=>x[1]))*100)}%"></div>

   </div>

  </div>

 `).join(""):emptyState("Todavía no hay series registradas.")}

 `)}

 ${card("Progreso individual",`

  <div class="field">

   <label>Seleccionar cliente</label>

   <select id="stats-client">

    <option value="">Seleccioná un cliente</option>

function assignPlan(clientId){

 const c=getClient(clientId);

 if(!c)return;

 if(!plans.length)return alert("Primero tenés que crear una planificación.");

 const options=plans.map((p,i)=>`${i+1}. ${p.name}`).join("\n");

 const answer=prompt("Elegí una planificación escribiendo su número:\n"+options);

 if(answer===null)return;

 const index=Number(answer)-1;

 if(!plans[index])return alert("Número incorrecto.");

 c.trainingPlan=JSON.parse(JSON.stringify(plans[index]));

 c.trainingPlan.id=uid();

 persistAll();

 selectedClient=clientId;

 page="clientes";

 render();

}

function editClientPlan(clientId){

 const c=getClient(clientId);

 if(!c||!c.trainingPlan)return;

 selectedClient=clientId;

 selectedPlan=c.trainingPlan.id;

 root.innerHTML=planEditorPage(c.trainingPlan);

}

function savePlan(id){

 const name=document.getElementById("plan-name").value.trim();

 if(!name)return alert("Ingresá un nombre para la planificación.");

 const existing=getPlan(id);

 const client=clients.find(c=>c.trainingPlan?.id===id);

 const plan=client?client.trainingPlan:existing;

 if(!plan)return;

 plan.name=name;

 plan.description=document.getElementById("plan-description").value.trim();

 document.querySelectorAll(".day-name").forEach(input=>{

  const index=Number(input.dataset.index);

  if(plan.days[index])plan.days[index].name=input.value.trim();

 });

 document.querySelectorAll(".plan-ex-series").forEach(input=>{

  const day=Number(input.dataset.day),index=Number(input.dataset.index);

  const ex=plan.days[day]?.exercises[index];

  if(ex)ex.sets=Math.max(1,number(input.value));

 });

 document.querySelectorAll(".plan-ex-reps").forEach(input=>{

  const ex=plan.days[Number(input.dataset.day)]?.exercises[Number(input.dataset.index)];

  if(ex)ex.reps=input.value;

 });

 document.querySelectorAll(".plan-ex-rest").forEach(input=>{

  const ex=plan.days[Number(input.dataset.day)]?.exercises[Number(input.dataset.index)];

  if(ex)ex.rest=number(input.value);

 });

 document.querySelectorAll(".plan-ex-rir").forEach(input=>{

  const ex=plan.days[Number(input.dataset.day)]?.exercises[Number(input.dataset.index)];

  if(ex)ex.rir=number(input.value);

 });

 persistAll();

 selectedPlan=null;

 page=client?"clientes":"planes";

 render();

}

function addDay(planId){

 const client=clients.find(c=>c.trainingPlan?.id===planId);

 const plan=client?client.trainingPlan:getPlan(planId);

 if(!plan)return;

 plan.days=plan.days||[];

 plan.days.push({id:uid(),name:"Nuevo día",exercises:[]});

 persistAll();

 render();

}

function addPlanExercise(planId,dayIndex){

 const client=clients.find(c=>c.trainingPlan?.id===planId);

 const plan=client?client.trainingPlan:getPlan(planId);

 if(!plan)return;

 const name=prompt("Nombre del ejercicio:");

 if(!name?.trim())return;

 const muscle=prompt("Grupo muscular:","Otros")||"Otros";

 plan.days[dayIndex].exercises.push({

  id:uid(),name:name.trim(),muscle,sets:3,reps:"8-12",rest:90,rir:2

 });

 persistAll();

 render();

}

 const options=days.map((d,i)=>`${i+1}. ${d.name}`).join("\n");

  date:today(),

function saveEvaluation(clientId){

 const c=getClient(clientId);

 if(!c)return;

 const weight=document.getElementById("evaluation-weight").value;

 const date=document.getElementById("evaluation-date").value||today();

 const note=document.getElementById("evaluation-note").value.trim();

 if(weight===""&&!note)return alert("Ingresá un peso o una observación.");

 c.evaluations=c.evaluations||[];

 c.evaluations.push({

  id:uid(),date,weight:weight===""?"":number(weight),note

 });

 persistAll();

 selectedClient=clientId;

 render();

}

function filterExercises(){

 const search=normalizeName(document.getElementById("exercise-search")?.value);

 const muscle=document.getElementById("exercise-filter")?.value||"Todos";

 const filtered=allExercises().filter(ex=>{

  const matchesName=normalizeName(ex.name).includes(search);

  const matchesMuscle=muscle==="Todos"||ex.muscle===muscle;

  return matchesName&&matchesMuscle;

 });

 const container=document.getElementById("exercise-results");

 if(container)container.innerHTML=exerciseListHTML(filtered);

}

function showClientStats(clientId){

 const c=getClient(clientId);

 const container=document.getElementById("client-stats-results");

 if(!container)return;

 if(!c){container.textContent="Seleccioná un cliente.";return;}

 const sessions=c.sessions||[];

 const sets=sessions.reduce((n,s)=>n+totalEffectiveSets(s),0);

 const weightEntries=(c.evaluations||[]).filter(e=>e.weight!==""&&e.weight!==undefined);

 container.innerHTML=`

  <div class="grid">

   <div class="item"><div class="muted">Entrenamientos</div><strong>${sessions.length}</strong></div>

   <div class="item"><div class="muted">Series efectivas</div><strong>${sets}</strong></div>

   <div class="item"><div class="muted">Evaluaciones con peso</div><strong>${weightEntries.length}</strong></div>

  </div>

 `;

}

/* ==========================================

   14. EVENTOS Y ACCIONES

========================================== */

document.addEventListener("click",event=>{

 const btn=event.target.closest("[data-action]");

 if(!btn)return;

 const action=btn.dataset.action;

 const id=btn.dataset.id;

 const index=Number(btn.dataset.index);

 const clientId=btn.dataset.client;

 const exIndex=Number(btn.dataset.ex);

 const setIndex=Number(btn.dataset.set);

 switch(action){

  case "go-clients":navigate("clientes");break;

  case "go-plans":navigate("planes");break;

  case "go-exercises":navigate("ejercicios");break;

  case "go-stats":navigate("estadisticas");break;

  case "new-plan":

   selectedPlan=uid();

   plans.push({id:selectedPlan,name:"Nueva planificación",description:"",days:[]});

   render();

   break;

  case "edit-plan":

   selectedPlan=id;render();break;

  case "cancel-plan":

   if(selectedPlan&&!getPlan(selectedPlan)){

    plans=plans.filter(p=>p.id!==selectedPlan);

   }

   selectedPlan=null;render();break;

  case "save-plan":savePlan(id);break;

  case "add-day":addDay(id);break;

  case "delete-day":{

   const p=getPlan(btn.dataset.plan)||clients.find(c=>c.trainingPlan?.id===btn.dataset.plan)?.trainingPlan;

   if(p&&confirmDelete("¿Eliminar este día?")){

    p.days.splice(index,1);persistAll();render();

   }

   break;

  }

  case "add-plan-exercise":addPlanExercise(btn.dataset.plan,index);break;

  case "remove-plan-exercise":{

   const pid=btn.dataset.plan;

   const p=getPlan(pid)||clients.find(c=>c.trainingPlan?.id===pid)?.trainingPlan;

   if(p&&confirmDelete("¿Quitar este ejercicio?")){

    p.days[Number(btn.dataset.day)].exercises.splice(index,1);

    persistAll();render();

   }

   break;

  }

  case "delete-plan":

   if(confirmDelete("¿Eliminar esta planificación?")){

    plans=plans.filter(p=>p.id!==id);

    persistAll();render();

   }

   break;

  case "new-client":newClientForm();break;

  case "edit-client":newClientForm(getClient(id));break;

  case "save-client":saveClient(id);break;

  case "cancel-client":navigate("clientes");break;

  case "open-client":selectedClient=id;page="clientes";render();break;

  case "back-clients":selectedClient=null;page="clientes";render();break;

  case "delete-client":

   if(confirmDelete("¿Eliminar este cliente y sus registros?")){

    clients=clients.filter(c=>c.id!==id);

    persistAll();render();

   }

   break;

  case "assign-plan":assignPlan(id);break;

  case "edit-client-plan":editClientPlan(id);break;

  case "new-session":startNewSession(id);break;

  case "save-session":saveSession();break;

  case "cancel-session":

   editingSession=null;selectedClient=null;page="clientes";render();break;

  case "add-set":

   if(editingSession){

    editingSession.exercises[exIndex].series.push({weight:0,reps:0,rir:2,type:"Efectiva"});

    sessionEditorPage();

   }

   break;

  case "remove-set":

   if(editingSession){

    editingSession.exercises[exIndex].series.splice(setIndex,1);

    sessionEditorPage();

   }

   break;

  case "open-session":viewSession(clientId,id);break;

  case "delete-session":{

   const c=getClient(clientId);

   if(c&&confirmDelete("¿Eliminar este entrenamiento?")){

    c.sessions=c.sessions.filter(s=>s.id!==id);

    persistAll();selectedClient=clientId;page="clientes";render();

   }

   break;

  }

  case "save-evaluation":saveEvaluation(id);break;

  case "delete-evaluation":{

   const c=getClient(clientId);

   if(c&&confirmDelete("¿Eliminar esta evaluación?")){

    c.evaluations=c.evaluations.filter(e=>e.id!==id);

    persistAll();selectedClient=clientId;render();

   }

   break;

  }

  case "new-exercise":exerciseForm();break;

  case "edit-exercise":exerciseForm(customExercises.find(x=>x.id===id));break;

  case "save-exercise":saveExercise(id);break;

  case "cancel-exercise":navigate("ejercicios");break;

  case "delete-exercise":

   if(confirmDelete("¿Eliminar este ejercicio personalizado?")){

    customExercises=customExercises.filter(x=>x.id!==id);

function svgLineChart(points,title,unit="kg"){

 if(!points.length)return emptyState("Todavía no hay datos suficientes para mostrar el gráfico.");

 const width=650,height=250,pad=45;

 const values=points.map(p=>number(p.value));

 let min=Math.min(...values),max=Math.max(...values);

 if(min===max){min=Math.max(0,min-1);max=max+1;}

 const x=i=>pad+(points.length===1?(width-pad*2)/2:i*(width-pad*2)/(points.length-1));

 const y=v=>height-pad-((v-min)/(max-min))*(height-pad*2);

 const coords=points.map((p,i)=>`${x(i)},${y(number(p.value))}`).join(" ");

 const circles=points.map((p,i)=>`

  <circle cx="${x(i)}" cy="${y(number(p.value))}" r="5" fill="#b5f36b">

   <title>${esc(p.label)}: ${number(p.value)} ${esc(unit)}</title>

  </circle>

 `).join("");

 return `

 <div class="chart-box">

  <div class="small muted">${esc(title)}</div>

  <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(title)}">

   ${[0,1,2,3].map(i=>{

    const yy=pad+i*(height-pad*2)/3;

    const val=max-i*(max-min)/3;

    return `<line x1="${pad}" y1="${yy}" x2="${width-pad}" y2="${yy}" stroke="#303b33" stroke-width="1"/>

    <text x="5" y="${yy+4}" fill="#9ba79d" font-size="11">${val.toFixed(1)}</text>`;

   }).join("")}

   <polyline points="${coords}" fill="none" stroke="#b5f36b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

   ${circles}

   <text x="${pad}" y="${height-8}" fill="#9ba79d" font-size="10">${esc(points[0].label)}</text>

   <text x="${width-pad}" y="${height-8}" fill="#9ba79d" font-size="10" text-anchor="end">${esc(points[points.length-1].label)}</text>

  </svg>

 </div>`;

}

function clientExerciseNames(c){

 const names=new Map();

 (c.sessions||[]).forEach(s=>{

  (s.exercises||[]).forEach(ex=>{

   const key=normalizeName(ex.name);

   if(key&&!names.has(key))names.set(key,ex.name);

  });

 });

 return [...names.entries()].sort((a,b)=>a[1].localeCompare(b[1],"es"));

}

function getExerciseHistory(c,name){

 const key=normalizeName(name);

 return (c.sessions||[])

  .map(session=>{

   const exercise=(session.exercises||[]).find(ex=>normalizeName(ex.name)===key);

   if(!exercise)return null;

   const effective=effectiveSets(exercise);

   const sets=effective.length?effective:(exercise.series||[]);

   const best=sets.reduce((best,set)=>{

    if(!best||number(set.weight)>number(best.weight))return set;

    return best;

   },null);

   return {

    date:session.date,

    dayName:session.dayName,

    sessionId:session.id,

    exercise,

    bestWeight:number(best?.weight),

    bestReps:number(best?.reps),

    bestRir:number(best?.rir),

    effectiveSets:effective.length,

    series:exercise.series||[]

   };

  })

  .filter(Boolean)

  .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));

}

function compareExerciseSessions(c,name){

 const history=getExerciseHistory(c,name);

 const last=history.slice(-2);

 if(last.length<2){

  return `<div class="notice">Necesitás al menos dos entrenamientos con este ejercicio para compararlos.</div>`;

 }

 const a=last[0],b=last[1];

 const difference=b.bestWeight-a.bestWeight;

 const differenceText=difference>0?`+${difference}`:String(difference);

 return `

 <div class="grid">

  <div class="item">

   <div class="muted small">Entrenamiento anterior · ${formatDate(a.date)}</div>

   <h2>${a.bestWeight} kg</h2>

   <div class="small">${a.bestReps} repeticiones · RIR ${a.bestRir}</div>

   <div class="small muted">${a.effectiveSets} series efectivas</div>

  </div>

  <div class="item">

   <div class="muted small">Último entrenamiento · ${formatDate(b.date)}</div>

   <h2>${b.bestWeight} kg</h2>

   <div class="small">${b.bestReps} repeticiones · RIR ${b.bestRir}</div>

   <div class="small muted">${b.effectiveSets} series efectivas</div>

  </div>

 </div>

 <div class="notice">

  Diferencia de carga: <strong>${differenceText} kg</strong>

 </div>

 `;

}

function filterClientHistory(){

function formatSeconds(seconds){

 const safe=Math.max(0,Math.floor(seconds));

 return String(Math.floor(safe/60)).padStart(2,"0")+":"+String(safe%60).padStart(2,"0");

}

let timerMode="rest";

let circuitState={round:1,phase:"Trabajo",work:30,rest:15,rounds:4};

function stopTimer(){

 if(timerInterval){

  clearInterval(timerInterval);

  timerInterval=null;

 }

}

function startRestTimer(){

 stopTimer();

 timerMode="rest";

 timerSeconds=Math.max(1,number(document.getElementById("rest-duration")?.value)||90);

 updateTimerDisplay();

 timerInterval=setInterval(()=>{

  timerSeconds--;

  updateTimerDisplay();

  if(timerSeconds<=0){

   stopTimer();

   alert("¡Terminó el descanso!");

  }

 },1000);

}

function startCircuitTimer(){

 stopTimer();

 timerMode="circuit";

 circuitState={

  round:1,

  phase:"Trabajo",

  work:Math.max(1,number(document.getElementById("circuit-work")?.value)||30),

  rest:Math.max(0,number(document.getElementById("circuit-rest")?.value)||15),

  rounds:Math.max(1,number(document.getElementById("circuit-rounds")?.value)||4)

 };

 timerSeconds=circuitState.work;

 updateTimerDisplay();

 timerInterval=setInterval(()=>{

  timerSeconds--;

  if(timerSeconds<=0){

   if(circuitState.phase==="Trabajo"){

    if(circuitState.rest>0){

     circuitState.phase="Descanso";

     timerSeconds=circuitState.rest;

    }else{

     nextCircuitRound();

    }

   }else{

    nextCircuitRound();

   }

  }

  updateTimerDisplay();

 },1000);

}

function nextCircuitRound(){

 if(circuitState.round>=circuitState.rounds){

  stopTimer();

  timerSeconds=0;

  alert("¡Circuito terminado!");

  return;

 }

 circuitState.round++;

 circuitState.phase="Trabajo";

 timerSeconds=circuitState.work;

}

function updateTimerDisplay(){

 const rest=document.getElementById("rest-display");

 const circuit=document.getElementById("circuit-display");

 const status=document.getElementById("circuit-status");

 if(rest&&timerMode==="rest")rest.textContent=formatSeconds(timerSeconds);

 if(circuit&&timerMode==="circuit"){

  circuit.textContent=formatSeconds(timerSeconds);

  if(status)status.textContent=`Vuelta ${circuitState.round} de ${circuitState.rounds} · ${circuitState.phase}`;

 }

}

function exportData(){

 const data={

  version:5,

  exportedAt:new Date().toISOString(),

  plans,

  customExercises,

  clients

 };

 downloadFile(

  "TP-Training-Planner-backup-"+today()+".json",

  JSON.stringify(data,null,2)

 );

}

function importData(){

 const input=document.getElementById("import-file");

 const file=input?.files?.[0];

 if(!file)return alert("Primero seleccioná un archivo.");

 const reader=new FileReader();

 reader.onload=()=>{

  try{

   const data=JSON.parse(reader.result);

   if(Array.isArray(data)){

    if(!confirmDelete("El archivo contiene planificaciones. ¿Reemplazar las actuales?"))return;

    plans=data;

   }else{

    if(!data||typeof data!=="object")throw new Error("Formato incorrecto.");

    if(!Array.isArray(data.plans)||!Array.isArray(data.customExercises||[])||!Array.isArray(data.clients||[])){

     throw new Error("El archivo no tiene el formato esperado.");

    }

    if(!confirmDelete("Se reemplazarán tus planificaciones, ejercicios y clientes actuales. ¿Continuar?"))return;

    plans=data.plans;

    customExercises=data.customExercises||[];

    clients=data.clients||[];

   }

   persistAll();

   selectedPlan=null;

   selectedClient=null;

   editingSession=null;

   page="inicio";

   render();

   alert("Importación realizada correctamente.");

  }catch(error){

   alert("No se pudo importar el archivo: "+error.message);

  }

 };

 reader.readAsText(file);

}

 if(!btn)return;

 switch(btn.dataset.action){

  case "calculate-volume":{

   const sets=Math.max(0,number(document.getElementById("volume-sets")?.value));

   const frequency=Math.max(0,number(document.getElementById("volume-frequency")?.value));

   const result=document.getElementById("volume-result");

   if(result){

    result.classList.remove("hidden");

    result.textContent=`${exercises*sets} series efectivas por sesión · ${exercises*sets*frequency} series semanales estimadas.`;

   }

   break;

  }

  case "calculate-orm":{

   const weight=number(document.getElementById("orm-weight")?.value);

   const reps=Math.max(1,number(document.getElementById("orm-reps")?.value));

   const result=document.getElementById("orm-result");

   if(weight<=0||reps>15){

    alert("Ingresá una carga válida y entre 1 y 15 repeticiones.");

    break;

   }

   const estimated=weight*(1+reps/30);

   if(result){

    result.classList.remove("hidden");

    result.textContent=`1RM estimado: ${estimated.toFixed(1)} kg. Es una estimación, no una medición real.`;

   }

   break;

  }

  case "start-rest":startRestTimer();break;

  case "start-circuit":startCircuitTimer();break;

  case "pause-timer":stopTimer();break;

  case "reset-timer":

   stopTimer();

   timerMode="rest";

   timerSeconds=0;

   updateTimerDisplay();

   if(document.getElementById("rest-display")){

    document.getElementById("rest-display").textContent="00:00";

   }

   if(document.getElementById("circuit-display")){

    document.getElementById("circuit-display").textContent="Listo";

    document.getElementById("circuit-status").textContent="Preparado para comenzar.";

   }

   break;

  case "export-data":exportData();break;

  case "import-data":importData();break;

 }
